<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON — Book or join the queue</title>
<!-- Bump this when the file changes. Check it with View Source, or read the
     banner this page logs to the console, to confirm what is actually live. -->
<meta name="icon-build" content="4.0-atelier">
<meta name="description" content="See the live wait, join the queue, or book a slot for later.">
<meta name="theme-color" content="#F6F1E8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Inter+Tight:wght@400..700&display=swap">
<link rel="stylesheet" href="./icon.css">
<!-- Customer page only; the other screens use icon.css alone. -->
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./customer.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- Vendored QR encoder (MIT, already in the repo for admin.html). Drawn on
     the device, so a booking reference never goes to a QR service. -->
<script src="./vendor/qrcode.js"></script>
<script>
  /* The vendor/ folder does not always survive a deploy, and a 404 here used to
     mean no QR anywhere with no way to tell that from a stale page. So: if the
     local copy didn't define window.qrcode, pull the same pinned library from
     the CDN. Everything that draws a code waits on this promise. */
  window.ICON_QR_READY = (typeof window.qrcode === 'function')
    ? Promise.resolve(true)
    : new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
        s.onload  = function () { resolve(typeof window.qrcode === 'function'); };
        s.onerror = function () { resolve(false); };
        document.head.appendChild(s);
      });
</script>
</head>
<body>

<a class="skip" href="#root">Skip to content</a>
<header class="nav ms-glass" id="nav">
  <div class="wrap nav__in">
    <span class="nav__brand" id="brand" translate="no">Icon</span>
    <nav class="nav__links" aria-label="Main" id="navLinks">
      <!-- Shown on a shop's page only (body.is-home) -->
      <a href="#menu" class="cnav__sec">Services</a>
      <a href="#team" class="cnav__sec">Team</a>
      <a href="#hours" class="cnav__sec">Hours</a>
      <a href="#" id="navBoard">Live board</a>
      <a href="./login.html" class="nav__cta">Staff sign in</a>
    </nav>
    <button class="nav__toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navSheet" aria-label="Menu"><span></span></button>
  </div>
  <nav class="nav__sheet" id="navSheet" aria-label="Menu" hidden></nav>
</header>

<main id="root" tabindex="-1">
  <p class="loading" role="status">Loading the shop…</p>
</main>

<script src="./config.js"></script>
<script src="./icon.js"></script>
<script src="./assets/photos.js"></script>
<script src="./ui.js"></script>
<script>
(function () {
  'use strict';
  if (!window.ICON) return;
  var ICON = window.ICON;
  var root = document.getElementById('root');

  /* ---------- State ---------- */

  var S = {
    shop: null,
    categories: [],     // directory, when no ?shop= was given
    shops: [],
    category: null,     // chosen category slug
    browsing: false,    // true until a shop is picked
    calMonth: null,     // first of the month shown in the booking calendar
    scanned: null,      // a booking opened by scanning its QR (?ref=)
    route: null,        // 'queue' | 'book'
    step: 0,
    audience: null,     // 'men' | 'women' | 'kids' | null
    service: null,
    staffId: null,
    day: null,          // 'YYYY-MM-DD'
    slot: null,         // ISO string
    comeBack: null,     // queue route: preferred time or null
    name: '',
    phone: '',
    notes: '',
    rows: [],           // live queue
    slots: [],
    calendar: [],
    busy: false,
    error: ''
  };

  var AUDIENCE_LABEL = { men: 'Men', women: 'Women', kids: 'Kids', unisex: 'Everyone' };
  var query = '';         // directory search, filters the shops already loaded
  var lastView = null;    // which view is on screen, so re-renders don't replay the entrance
  var lastStep = null;    // the step shown last, to slide the next one in from the right side
  var CATEGORY_LABEL = {
    hair: 'Hair', beard: 'Beard', nails: 'Nails', skin: 'Skin', spa: 'Spa', other: 'Other'
  };

  /* ---------- Boot ---------- */

  (async function start() {
    // Scanned a booking QR? Show that booking and stop. Done before the
    // shop lookup because the code alone identifies everything we need.
    var ref = new URLSearchParams(location.search).get('ref');
    if (ref) {
      var got = await ICON.book.status(ref);
      if (got.ok) {
        S.scanned = got.data;
        document.getElementById('brand').textContent = got.data.shop || 'Icon';
        document.title = 'Booking \u00b7 ' + (got.data.shop || 'Icon');
        document.getElementById('navBoard').style.display = 'none';
        renderScanned(got.data);
        return;
      }
      // Bad or expired code: say so, then carry on to the normal flow.
      paint(notice('Booking not found',
        'That code didn\u2019t match a booking. It may have been cancelled, ' +
        'or the link was mistyped.'), 'notice');
      return;
    }

    var out = await ICON.shop.resolve();

    // No ?shop= and more than one shop: open the directory.
    if (!out.ok && out.browse) {
      S.browsing = true;
      S.shops = out.shops || [];
      var cats = await ICON.shop.categories();
      S.categories = cats.ok ? cats.data : [];
      document.getElementById('navBoard').style.display = 'none';
      renderBrowse();
      return;
    }

    if (!out.ok) {
      paint(notice('Shop not found',
        ICON.esc(out.error) + '<br><br>Check the link or scan the QR code at the counter again.'), 'notice');
      return;
    }

    openShop(out.shop);
  })();

  function openShop(shopRow) {
    S.shop = shopRow;
    S.browsing = false;
    document.getElementById('brand').textContent = S.shop.name;
    document.title = S.shop.name + ' — Book or join the queue';
    var board = document.getElementById('navBoard');
    board.style.display = '';
    board.href = './tv.html?shop=' + encodeURIComponent(S.shop.slug);
    ICON.queue.subscribe('customer-queue', refreshQueue);
  }

  async function refreshQueue() {
    if (S.browsing || !S.shop) return;
    var res = await ICON.queue.open();
    if (!res.error) S.rows = res.data || [];
    render();
  }

  /* ---------- Painting ---------- */

  // Every view goes through here. The entrance plays only when the view
  // changes: the live queue re-renders every few seconds and must not
  // replay it, so a repaint of the same view shows everything at once.
  function paint(html, view) {
    var fresh = view !== lastView;
    root.innerHTML = html;
    document.body.classList.toggle('is-home', view === 'step:route' || view === 'closed');
    if (fresh) {
      root.classList.remove('is-entering');
      void root.offsetWidth;
      root.classList.add('is-entering');
      lastView = view;
    } else {
      root.classList.remove('is-entering');
    }
    if (window.MS) MS.refresh(root, { instant: !fresh });
    placeSeg();
    watchDock();
  }

  function notice(title, bodyHtml) {
    return '<div class="wrap notice"><div class="empty" data-enter><strong>' +
      ICON.esc(title) + '</strong>' + bodyHtml + '</div></div>';
  }

  // The close: the mark set large, one line, the links people come back for.
  function footer() {
    var onShop = S.shop && !S.browsing;
    return '<footer class="cfoot"><div class="wrap">' +
      '<p class="cfoot__mark" translate="no" data-reveal="fade">Icon</p>' +
      '<div class="cfoot__row">' +
        '<p>Live queues and appointments for neighbourhood barbers, nail studios and car washes.</p>' +
        '<nav class="cfoot__links" aria-label="Footer">' +
          (onShop ? '<a href="./tv.html?shop=' + encodeURIComponent(S.shop.slug) + '">Live board</a>' : '') +
          (onShop && S.shops.length > 1 ? '<a href="./index.html">All shops</a>' : '') +
          '<a href="./login.html">Staff sign in</a>' +
        '</nav>' +
      '</div>' +
    '</div></footer>';
  }

  // The order an element enters in, for the staggered entrance.
  function enter(i) { return ' data-enter style="--i:' + i + '"'; }

  /* ---------- Shared pieces: pictures, header, dock ---------- */

  // Which drawn glyph stands in for a picture of each kind of thing.
  var CAT_GLYPH = { barbers: 'scissors', 'nail-salon': 'polish', 'car-wash': 'drop' };
  var SVC_GLYPH = { hair: 'scissors', beard: 'comb', nails: 'polish', skin: 'drop', spa: 'towel', other: 'drop' };

  function initial(name) { return String(name || '?').trim().charAt(0).toUpperCase(); }

  // Slide the segmented control's pill under the pressed button.
  function placeSeg() {
    root.querySelectorAll('.seg').forEach(function (seg) {
      var pill = seg.querySelector('.seg__pill');
      var on = seg.querySelector('[aria-pressed="true"]');
      if (!pill || !on) return;
      pill.style.width = on.offsetWidth + 'px';
      pill.style.transform = 'translate(' + on.offsetLeft + 'px,' + (on.offsetTop - 4) + 'px)';
    });
  }
  window.addEventListener('resize', placeSeg);

  // The booking dock rises once the hero's buttons have scrolled away.
  var dockIo = null;
  function watchDock() {
    if (dockIo) { dockIo.disconnect(); dockIo = null; }
    var dock = document.getElementById('dock');
    var anchor = document.getElementById('heroActs');
    if (!dock || !anchor || !('IntersectionObserver' in window)) return;
    dockIo = new IntersectionObserver(function (en) {
      var gone = !en[0].isIntersecting && en[0].boundingClientRect.top < 0;
      dock.classList.toggle('is-up', gone);
      dock.toggleAttribute('inert', !gone);
    });
    dockIo.observe(anchor);
  }

  // Header: a hairline once the page scrolls, and the phone menu sheet.
  (function header() {
    var nav = document.getElementById('nav');
    var toggle = document.getElementById('navToggle');
    var sheet = document.getElementById('navSheet');
    var onScroll = function () { nav.classList.toggle('is-scrolled', window.scrollY > 8); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    function close() {
      toggle.setAttribute('aria-expanded', 'false');
      sheet.hidden = true;
    }
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') !== 'true';
      if (!open) return close();
      // The sheet mirrors whichever header links this view shows.
      sheet.innerHTML = '';
      document.querySelectorAll('#navLinks a').forEach(function (a, i) {
        if (getComputedStyle(a).display === 'none' || a.style.display === 'none') return;
        var c = document.createElement('a');
        c.href = a.getAttribute('href');
        c.textContent = a.textContent;
        c.style.setProperty('--i', i);
        c.addEventListener('click', close);
        sheet.appendChild(c);
      });
      toggle.setAttribute('aria-expanded', 'true');
      sheet.hidden = false;
      var first = sheet.querySelector('a');
      if (first) first.focus();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !sheet.hidden) { close(); toggle.focus(); }
    });
    window.addEventListener('resize', function () { if (window.innerWidth > 832) close(); });
  })();

  /* ---------- Directory: categories, then shops ---------- */

  function renderBrowse() {
    var cats = S.categories.filter(function (c) { return Number(c.shop_count) > 0; });
    var open = S.shops.filter(function (x) { return x.is_open; });

    // Real figures from the directory, not marketing numbers.
    var cheapest = open.filter(function (x) { return x.from_price_minor; })
      .sort(function (a, b) { return a.from_price_minor - b.from_price_minor; })[0];

    var html =
      '<section class="dhero" aria-labelledby="dirTitle"><div class="wrap dhero__grid">' +
        '<div>' +
          '<h1 class="ms-display dhero__title" id="dirTitle"' + enter(0) + '>Your chair, without the wait.</h1>' +
          '<p class="lede"' + enter(1) + '>Join the live line at a barber, nail studio or car wash from your phone, ' +
            'or reserve a time that suits you.</p>' +
          '<form class="search" role="search" id="searchForm"' + enter(2) + '>' +
            '<label for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
              '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>' +
              '<span class="ms-sr">Search shops</span>' +
              '<input type="search" id="q" autocomplete="off" placeholder="Shop name, street or area…" value="' +
                ICON.esc(query) + '"></label>' +
            '<button type="submit" class="ms-btn ms-btn--primary" data-magnetic>Find a shop</button>' +
          '</form>' +
          '<dl class="dstats"' + enter(3) + '>' +
            '<div><dt>Open now</dt><dd>' + open.length + '</dd></div>' +
            '<div><dt>Categories</dt><dd>' + cats.length + '</dd></div>' +
            (cheapest ? '<div><dt>Services from</dt><dd>' + ICON.esc(ICON.fmtMoney(cheapest.from_price_minor, cheapest.currency)) + '</dd></div>' : '') +
          '</dl>' +
        '</div>' +
        '<div class="dhero__media"' + enter(2) + '>' +
          MS.photo('hero', { ratio: '4 / 5', glyph: 'chair', parallax: 0.06, eager: true, alt: 'Inside the salon' }) +
          '<div class="dhero__float ms-glass" aria-hidden="true"><span class="ms-live"></span>' +
            '<div><strong>' + open.length + '</strong><span>' + (open.length === 1 ? 'shop' : 'shops') + ' taking customers</span></div></div>' +
        '</div>' +
      '</div></section>' +

      '<section class="wrap find" id="find" aria-labelledby="findTitle">' +
        '<div class="sec-head"><h2 class="h-sec" id="findTitle" data-reveal>' + ICON.esc(findTitle()) + '</h2>' +
          '<p class="find__count" id="findCount" aria-live="polite"></p></div>' +
        errorBox() +
        (cats.length
          ? '<div class="find__bar"><div class="seg" role="group" aria-label="Categories"><span class="seg__pill" aria-hidden="true"></span>' +
              '<button type="button" data-act="backCat"' + (S.category ? '' : ' aria-pressed="true"') + '>' +
                'All <small>' + open.length + '</small></button>' +
              cats.map(function (c) {
                return '<button type="button" data-act="cat" data-slug="' + ICON.esc(c.slug) + '"' +
                  (S.category === c.slug ? ' aria-pressed="true"' : '') +
                  (c.tagline ? ' title="' + ICON.esc(c.tagline) + '"' : '') + '>' +
                  ICON.esc(c.name) + ' <small>' + c.shop_count + '</small></button>';
              }).join('') +
            '</div></div>'
          : '') +
        '<div id="results"></div>' +
      '</section>' +

      howItWorks() +
      footer();

    paint(html, 'browse');
    bind();          // the page's own buttons; drawResults binds its cards
    drawResults();

    var q = document.getElementById('q');
    q.addEventListener('input', function () { query = q.value; drawResults(); });
    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      query = q.value;
      drawResults();
      document.getElementById('find').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function findTitle() {
    var cat = S.categories.filter(function (c) { return c.slug === S.category; })[0];
    return cat ? cat.name : 'Every shop';
  }

  // Search narrows the list already loaded; it never goes back to the server.
  function matchingShops() {
    var list = S.shops.filter(function (x) { return !S.category || x.category === S.category; });
    var words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (!words.length) return list;
    return list.filter(function (x) {
      var cat = S.categories.filter(function (c) { return c.slug === x.category; })[0];
      var hay = [x.name, x.address, cat && cat.name, x.kind].join(' ').toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });
  }

  function drawResults() {
    var box = document.getElementById('results');
    if (!box) return;
    var list = matchingShops();
    var count = document.getElementById('findCount');

    if (count) {
      count.textContent = list.length + (list.length === 1 ? ' shop' : ' shops') +
        (query.trim() ? ' match “' + query.trim() + '”' : '');
    }

    if (S.shops.length === 0 || (!S.category && !S.categories.some(function (c) { return Number(c.shop_count) > 0; }) && !query.trim())) {
      box.innerHTML = '<div class="empty"><strong>Nothing open</strong>No shops are taking customers right now.</div>';
      return;
    }

    if (list.length === 0) {
      box.innerHTML = '<div class="empty"><strong>' + (query.trim() ? 'No match' : 'None here yet') + '</strong>' +
        (query.trim()
          ? 'No shop matches “' + ICON.esc(query.trim()) + '”' + (S.category ? ' in ' + ICON.esc(findTitle()) : '') + '.'
          : 'Try another category.') +
        '<br><button type="button" class="ms-btn ms-btn--secondary" data-act="clearSearch">Show every shop</button></div>';
      box.querySelectorAll('[data-act]').forEach(function (el) { el.addEventListener('click', onAction); });
      return;
    }

    box.innerHTML = '<div class="shops" data-stagger>' + list.map(function (x) {
      var cat = S.categories.filter(function (c) { return c.slug === x.category; })[0];
      var bits = [];
      if (cat && !S.category) bits.push('<span>' + ICON.esc(cat.name) + '</span>');
      if (x.from_price_minor) bits.push('<span>From <b>' + ICON.esc(ICON.fmtMoney(x.from_price_minor, x.currency)) + '</b></span>');
      if (x.service_count) bits.push('<span>' + x.service_count + ' services</span>');
      if (x.staff_count) bits.push('<span>' + x.staff_count + (Number(x.staff_count) === 1 ? ' person' : ' people') + '</span>');
      return '<button class="shopcard" data-act="shop" data-slug="' + ICON.esc(x.slug) + '"' +
        (x.is_open ? '' : ' disabled') + ' data-reveal>' +
        MS.photo('shop:' + x.slug, { ratio: '4 / 3', mono: initial(x.name), zoom: true, alt: x.name }) +
        '<span class="shopcard__body">' +
          '<span class="shopcard__top"><span class="shopcard__name">' + ICON.esc(x.name) + '</span>' +
            (x.is_open ? '<span class="ms-badge ms-badge--chair">Open</span>' : '<span class="ms-badge ms-badge--done">Closed</span>') +
          '</span>' +
          (x.address ? '<span class="shopcard__addr">' + ICON.esc(x.address) + '</span>' : '') +
          '<span class="shopcard__meta">' + bits.join('') + '</span>' +
        '</span>' +
      '</button>';
    }).join('') + '</div>';

    box.querySelectorAll('[data-act]').forEach(function (el) { el.addEventListener('click', onAction); });
    if (window.MS) MS.refresh(box);
  }

  // How a visit works, as the real sequence it is.
  function howItWorks() {
    return '<section class="how" aria-labelledby="howTitle"><div class="wrap">' +
      '<h2 class="h-sec" id="howTitle" data-reveal>How a visit works</h2>' +
      '<ol class="how__steps" data-stagger>' +
        '<li data-reveal><h3>Choose a shop</h3><p>See who is open, what everything costs and how long the line is right now.</p></li>' +
        '<li data-reveal><h3>Join the line or book</h3><p>Take a place in the live queue, or pick a day and a time for later.</p></li>' +
        '<li data-reveal><h3>Arrive for your turn</h3><p>Your ticket updates on its own, so you come in when the chair is ready.</p></li>' +
      '</ol>' +
    '</div></section>';
  }

  function bind() {
    root.querySelectorAll('[data-act]').forEach(function (el) {
      el.addEventListener('click', onAction);
    });
  }

  /* ---------- Derived ---------- */

  function waiting() { return S.rows.filter(function (r) { return r.status === 'waiting'; }); }
  function inChair() { return S.rows.filter(function (r) { return r.status === 'in_chair'; }); }
  function waitMins() { return ICON.queue.estimate(waiting().length); }

  function servicesFor(aud) {
    var all = S.shop.services || [];
    if (!aud) return all;
    return all.filter(function (s) { return s.audience === aud || s.audience === 'unisex'; });
  }

  function audienceOptions() {
    var seen = {};
    (S.shop.services || []).forEach(function (s) { seen[s.audience] = true; });
    var out = ['men', 'women', 'kids'].filter(function (a) { return seen[a]; });
    // Nothing but unisex services? Then there is no audience step to show.
    return out;
  }

  /* ---------- Navigation ---------- */

  // Steps per route. Audience step is skipped when there's nothing to choose.
  function steps() {
    var list = ['route'];
    if (!S.route) return list;
    if (audienceOptions().length > 1) list.push('audience');
    list.push('service');
    if (S.route === 'book') list.push('when');
    list.push('details');
    return list;
  }

  function stepName() { return steps()[S.step] || 'details'; }

  function go(delta) {
    var max = steps().length - 1;
    S.step = Math.min(max, Math.max(0, S.step + delta));
    S.error = '';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restart() {
    S.route = null; S.step = 0; S.audience = null; S.service = null;
    S.staffId = null; S.day = null; S.slot = null; S.comeBack = null;
    S.error = '';
    render();
  }

  /* ---------- Render ---------- */

  function render() {
    if (S.browsing) return renderBrowse();

    var mine = ICON.ticket.mine();
    var booked = ICON.book.mine();

    if (mine) return renderTicket(mine);
    if (booked) return renderBooking(booked);
    if (!S.shop.is_open) return renderClosed();

    var name = stepName();

    // The first step is the shop's own page, full width.
    if (name === 'route') {
      paint(stepRoute() + footer(), 'step:route');
      return wire(name);
    }

    var html = '';
    if (name === 'audience') html += stepAudience();
    if (name === 'service')  html += stepService();
    if (name === 'when')     html += stepWhen();
    if (name === 'details')  html += stepDetails();

    // Slide the new step in from the side it came from, once per step.
    var view = 'step:' + name;
    var dir = view === lastView || lastStep === null ? '' : (S.step >= lastStep ? 'fwd' : 'back');
    lastStep = S.step;

    paint(
      '<div class="bk"><div class="wrap">' + trail() + '</div>' +
      '<div class="wrap bk__grid"><div class="bk__main"' + (dir ? ' data-dir="' + dir + '"' : '') + '>' + html + '</div>' +
        summary() + '</div></div>',
      view);
    wire(name);
  }

  // Progress: each step by name, with a line that fills as you go.
  var STEP_LABEL = { route: 'Visit', audience: 'Who', service: 'Service', when: 'Time', details: 'Details' };
  function trail() {
    var all = steps();
    if (all.length < 2) return '';
    var p = S.step / (all.length - 1);
    return '<nav class="prog" aria-label="Booking progress">' +
      '<div class="prog__bar"><span class="prog__fill" style="--p:' + p.toFixed(3) + '"></span></div>' +
      '<ol class="prog__steps">' + all.map(function (n, i) {
        return '<li class="' + (i < S.step ? 'is-done' : i === S.step ? 'is-here' : '') + '"' +
          (i === S.step ? ' aria-current="step"' : '') + '>' + STEP_LABEL[n] + '</li>';
      }).join('') + '</ol></nav>';
  }

  function backBtn(label) {
    return '<button class="step__back textlink" data-act="back"' + enter(0) + '>\u2190 ' + ICON.esc(label || 'Back') + '</button>';
  }

  // The booking so far, as a stub beside the steps (desktop only; a phone
  // gets the recap on the last step instead).
  function summary() {
    var rows = [];
    function row(k, v) { rows.push([k, v || null]); }

    row('Service', S.service ? S.service.name + ' \u00b7 ' + S.service.duration_minutes + ' min' : null);
    if (S.route === 'book') {
      row('When', S.slot ? ICON.fmtDate(S.slot) + ', ' + ICON.fmtTime(S.slot)
                 : S.day ? ICON.fmtDate(S.day + 'T00:00:00') : null);
    } else {
      row('Wait', 'about ' + waitMins() + ' min');
    }
    var t = S.staffId && (S.shop.staff || []).filter(function (x) { return String(x.id) === String(S.staffId); })[0];
    if (S.route === 'book' || t) row('With', t ? t.name : 'Anyone');
    row('Price', S.service && S.service.price_minor > 0 ? ICON.fmtMoney(S.service.price_minor, S.shop.currency) : null);

    return '<aside class="stub" aria-label="Your booking so far"' + enter(2) + '>' +
      MS.photo('shop:' + S.shop.slug, { ratio: '16 / 9', mono: initial(S.shop.name), dark: true, alt: S.shop.name }) +
      '<div class="stub__body">' +
        '<div class="stub__kind"><span>' + (S.route === 'queue' ? 'Walk-in ticket' : 'Booking') + '</span>' +
          '<span>' + (isOpenNow() ? 'Open now' : 'Closed now') + '</span></div>' +
        '<p class="stub__shop">' + ICON.esc(S.shop.name) + '</p>' +
        (S.shop.address ? '<p class="stub__addr">' + ICON.esc(S.shop.address) + '</p>' : '') +
        '<dl>' + rows.map(function (r) {
          return '<div class="ticket__row' + (r[1] ? '' : ' is-pending') + '"><dt>' + ICON.esc(r[0]) + '</dt><dd>' +
            ICON.esc(r[1] || 'Not chosen yet') + '</dd></div>';
        }).join('') + '</dl>' +
        '<p class="stub__foot">Nothing is held until you confirm.</p>' +
      '</div>' +
    '</aside>';
  }

  // "20:00" -> "8:00 pm"
  function clock(hhmm) {
    var p = String(hhmm || '0:0').split(':');
    return ICON.fmtTime(new Date(2000, 0, 1, parseInt(p[0], 10) || 0, parseInt(p[1], 10) || 0));
  }

  function todayHours() {
    var now = new Date();
    return (S.shop.hours || []).filter(function (x) { return x.weekday === now.getDay(); })[0] || null;
  }

  // Where the shop stands right now, in words, from its own hours.
  function shopStatus() {
    if (!S.shop.is_open) return { open: false, text: 'Not taking customers right now', next: '' };
    var h = todayHours();
    if (isOpenNow()) return { open: true, text: 'Open now, until ' + clock(h.closes_at), next: '' };

    var now = new Date();
    var mins = now.getHours() * 60 + now.getMinutes();
    if (h && h.is_open && toMins(h.opens_at) > mins) {
      return { open: false, text: 'Opens today at ' + clock(h.opens_at), next: 'today at ' + clock(h.opens_at) };
    }
    for (var i = 1; i <= 7; i++) {
      var day = (now.getDay() + i) % 7;
      var x = (S.shop.hours || []).filter(function (y) { return y.weekday === day; })[0];
      if (x && x.is_open) {
        var when = i === 1 ? 'tomorrow' : ICON.fmtDay(day, true);
        return { open: false, text: 'Closed now, opens ' + when + ' at ' + clock(x.opens_at), next: when + ' at ' + clock(x.opens_at) };
      }
    }
    return { open: false, text: 'Closed right now', next: '' };
  }

  // The hero: the shop's picture full-bleed, its name set large, the
  // status in words, the ways in and the live line on glass.
  function hero(actionsHtml) {
    var st = shopStatus();
    var w = waiting().length;
    var c = inChair().length;

    return '<section class="shero" aria-labelledby="shopTitle" data-spotlight>' +
      '<div class="shero__media">' +
        MS.photo('shop:' + S.shop.slug, { dark: true, mono: initial(S.shop.name), parallax: 0.12, eager: true, alt: S.shop.name }) +
      '</div>' +
      '<div class="wrap shero__in"><div>' +
        (S.shops.length > 1 ? '<a class="shero__back" href="./index.html"' + enter(0) + '>← All shops</a>' : '') +
        '<h1 class="shero__name" id="shopTitle"' + enter(1) + '>' + ICON.esc(S.shop.name) + '</h1>' +
        '<div class="shero__facts"' + enter(2) + '>' +
          '<span class="status' + (st.open ? '' : ' is-closed') + '"><i aria-hidden="true"></i>' + ICON.esc(st.text) + '</span>' +
          (S.shop.address ? '<span class="shero__addr">' + ICON.esc(S.shop.address) + '</span>' : '') +
        '</div>' +
        actionsHtml +
      '</div>' +
      (S.shop.is_open
        ? '<aside class="live" aria-label="The line right now"' + enter(4) + '>' +
            '<p class="live__head"><span class="ms-live ms-live--on-dark" aria-hidden="true"></span>The line right now</p>' +
            '<p class="live__wait"><span class="num">' + waitMins() + '</span><span>min wait</span></p>' +
            '<dl>' +
              '<div><dt>Waiting</dt><dd>' + w + '</dd></div>' +
              '<div><dt>In the chair</dt><dd>' + c + '</dd></div>' +
              '<div><dt>Chairs</dt><dd>' + ICON.queue.chairs() + '</dd></div>' +
            '</dl>' +
            '<a class="ms-link" href="./tv.html?shop=' + encodeURIComponent(S.shop.slug) + '">Open the live board</a>' +
          '</aside>'
        : '') +
    '</div></section>';
  }

  // Services, team, hours: everything below the hero. `bookable` adds a
  // Book button to each service (the shop is taking customers).
  var svcCat = 'all';
  function sections(bookable) {
    var list = S.shop.services || [];
    var keys = [];
    list.forEach(function (s) { if (keys.indexOf(s.category) < 0) keys.push(s.category); });
    if (keys.indexOf(svcCat) < 0) svcCat = 'all';
    var clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

    var menu = '<section class="wrap sec" id="menu" aria-labelledby="menuTitle">' +
      '<div class="sec-head"><h2 class="h-sec" id="menuTitle" data-reveal>Services</h2>' +
        '<p data-reveal>Prices and times are set by the shop.</p></div>' +
      (keys.length > 1
        ? '<div class="seg" role="group" aria-label="Service type"><span class="seg__pill" aria-hidden="true"></span>' +
            ['all'].concat(keys).map(function (k) {
              var n = k === 'all' ? list.length : list.filter(function (s) { return s.category === k; }).length;
              return '<button type="button" data-act="svcCat" data-cat="' + ICON.esc(k) + '"' +
                (svcCat === k ? ' aria-pressed="true"' : '') + '>' +
                ICON.esc(k === 'all' ? 'All' : (CATEGORY_LABEL[k] || k)) + ' <small>' + n + '</small></button>';
            }).join('') + '</div>'
        : '') +
      (list.length === 0
        ? '<p class="mempty" style="margin-top:2rem;">The shop hasn’t added services yet. Ask at the counter.</p>'
        : '<div class="svcgrid" data-stagger>' + list.map(function (s) {
            return '<article class="svc" data-cat="' + ICON.esc(s.category) + '" data-reveal' +
              (svcCat !== 'all' && s.category !== svcCat ? ' hidden' : '') + '>' +
              MS.photo('service:' + s.category, { ratio: '5 / 4', glyph: SVC_GLYPH[s.category] || 'scissors', zoom: true, alt: s.name }) +
              '<div class="svc__body">' +
                '<div class="svc__top"><h3 class="svc__name">' + ICON.esc(s.name) + '</h3>' +
                  '<span class="svc__price">' + (s.price_minor > 0 ? ICON.esc(ICON.fmtMoney(s.price_minor, S.shop.currency)) : '—') + '</span></div>' +
                '<div class="svc__meta"><span>' + clockIcon + s.duration_minutes + '&nbsp;min</span>' +
                  (s.audience !== 'unisex' ? '<span class="ms-badge ms-badge--' + s.audience + '">' + AUDIENCE_LABEL[s.audience] + '</span>' : '') +
                '</div>' +
                (bookable ? '<button type="button" class="ms-btn ms-btn--outline ms-btn--sm" data-act="bookService" data-id="' + s.id + '">Book this</button>' : '') +
              '</div></article>';
          }).join('') + '</div>') +
    '</section>';

    var team = S.shop.staff || [];
    var crew = '<section class="wrap sec" id="team" aria-labelledby="teamTitle">' +
      '<div class="sec-head"><h2 class="h-sec" id="teamTitle" data-reveal>The team</h2>' +
        (team.length ? '<p data-reveal>' + team.length + (team.length === 1 ? ' person' : ' people') + ' taking customers.</p>' : '') + '</div>' +
      (team.length
        ? '<div class="team" data-stagger>' + team.map(function (t) {
            return '<article class="member" data-reveal>' +
              MS.photo('staff:' + S.shop.slug + ':' + String(t.name || '').toLowerCase(), { ratio: '4 / 5', mono: initial(t.name), zoom: true, alt: t.name }) +
              '<div class="member__cap"><span class="member__name">' + ICON.esc(t.name) + '</span>' +
                (t.title ? '<span class="member__title">' + ICON.esc(t.title) + '</span>' : '') + '</div>' +
            '</article>';
          }).join('') + '</div>'
        : '<p class="mempty">No team listed yet.</p>') +
    '</section>';

    var st = shopStatus();
    var tel = S.shop.contact_phone ? String(S.shop.contact_phone).replace(/[^0-9+]/g, '') : '';
    var visit = '<div class="wrap sec visitgrid">' +
      '<section id="hours" aria-labelledby="hoursTitle">' +
        '<h2 class="h-sec" id="hoursTitle" data-reveal>Opening hours</h2>' +
        '<div data-reveal>' + hoursTable() + '</div>' +
      '</section>' +
      '<aside class="visit" aria-labelledby="visitTitle" data-reveal="right">' +
        '<h2 class="h-sec" id="visitTitle">Visit ' + ICON.esc(S.shop.name) + '</h2>' +
        (S.shop.address ? '<p class="visit__addr">' + ICON.esc(S.shop.address) + '</p>' : '') +
        '<div class="visit__facts"><span class="status' + (st.open ? '' : ' is-closed') + '"><i aria-hidden="true"></i>' + ICON.esc(st.text) + '</span>' +
          (tel ? '<a class="visit__tel ms-link" href="tel:' + ICON.esc(tel) + '">' + ICON.esc(ICON.fmtPhone(S.shop.contact_phone)) + '</a>' : '') +
        '</div>' +
        (bookable ? '<div class="shero__acts">' + waysButtons() + '</div>' : '') +
      '</aside>' +
    '</div>';

    return menu + crew + visit;
  }

  function errorBox() {
    return S.error ? '<p class="msg msg--bad" role="alert">' + ICON.esc(S.error) + '</p>' : '';
  }

  /* ---------- Step: queue or book ---------- */

  // The two ways in. Joining the queue leads while the shop is open now;
  // otherwise booking leads and the queue button is disabled.
  function waysButtons(size) {
    var openNow = isOpenNow();
    var sz = size === 'sm' ? ' ms-btn--sm' : ' ms-btn--lg';
    var queueBtn = '<button class="ms-btn ' + (openNow ? 'ms-btn--accent' : 'ms-btn--outline') + sz + '" data-act="route" data-route="queue"' +
      (openNow ? ' data-magnetic' : ' disabled') + '>Join the queue</button>';
    var bookBtn = '<button class="ms-btn ' + (openNow ? 'ms-btn--outline' : 'ms-btn--accent') + sz + '" data-act="route" data-route="book"' +
      (openNow ? '' : ' data-magnetic') + '>Book a time</button>';
    return openNow ? queueBtn + bookBtn : bookBtn + queueBtn;
  }

  function stepRoute() {
    var w = waiting().length;
    var openNow = isOpenNow();
    var st = shopStatus();

    var hint = openNow
      ? (w === 0 ? 'Nobody waiting. Walk straight in.'
                 : 'About ' + waitMins() + ' min. You’d be ' + (w + 1) + ordinal(w + 1) + ' in line.')
      : 'The queue opens when the shop does' + (st.next ? ', ' + st.next : '') + '. You can book a time now.';

    return (S.error ? '<div class="wrap" style="padding-top:var(--nav-h);">' + errorBox() + '</div>' : '') +
      hero(
        '<div class="shero__acts" id="heroActs"' + enter(3) + '>' + waysButtons() + '</div>' +
        '<p class="shero__hint"' + enter(3) + ' aria-live="polite">' + ICON.esc(hint) + '</p>' +
        '<p class="shero__note"' + enter(3) + '>Already have a booking? It shows up here automatically on the phone you booked with.</p>') +
      sections(true) +
      '<div class="dock ms-glass" id="dock" inert>' +
        '<div class="dock__who"><b>' + ICON.esc(S.shop.name) + '</b><span>' + ICON.esc(st.text) + '</span></div>' +
        '<div class="dock__acts">' + waysButtons('sm') + '</div>' +
      '</div>';
  }

  function isOpenNow() {
    if (!S.shop.is_open) return false;
    var now = new Date();
    var h = (S.shop.hours || []).filter(function (x) { return x.weekday === now.getDay(); })[0];
    if (!h || !h.is_open) return false;
    var mins = now.getHours() * 60 + now.getMinutes();
    return mins >= toMins(h.opens_at) && mins < toMins(h.closes_at);
  }

  function toMins(hhmm) {
    var p = String(hhmm || '0:0').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }

  /* ---------- Step: who is it for ---------- */

  function stepAudience() {
    var opts = audienceOptions();
    return '' +
      backBtn() +
      '<h1 class="step__title"' + enter(1) + '>Who’s it for?</h1>' +
      '<p class="step__hint"' + enter(2) + '>So we show you the right services and prices.</p>' +
      '<div class="choices choices--two"' + enter(3) + '>' +
        opts.map(function (a) {
          var n = servicesFor(a).length;
          return '<button class="choice" data-act="audience" data-aud="' + a + '"' +
            (S.audience === a ? ' aria-pressed="true"' : '') + '>' +
            '<span class="choice__label">' + AUDIENCE_LABEL[a] + '</span>' +
            '<span class="choice__note">' + n + ' service' + (n === 1 ? '' : 's') + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
  }

  /* ---------- Step: which service ---------- */

  function stepService() {
    var list = servicesFor(S.audience);
    if (list.length === 0) {
      return backBtn() +
        '<h1 class="step__title"' + enter(1) + '>Nothing listed yet</h1>' +
        '<div class="empty"><strong>No services here</strong>' +
        'The shop hasn’t added services for this yet. Ask at the counter.</div>';
    }

    // Group by category so a long nail menu stays readable.
    var groups = {};
    list.forEach(function (s) { (groups[s.category] = groups[s.category] || []).push(s); });

    var html = backBtn() +
      '<h1 class="step__title"' + enter(1) + '>What do you want?</h1>' +
      '<p class="step__hint"' + enter(2) + '>Prices and times are what the shop set.</p>';

    Object.keys(groups).forEach(function (cat, gi) {
      if (Object.keys(groups).length > 1) {
        html += '<h2 class="step__sub"' + enter(gi + 3) + '>' + ICON.esc(CATEGORY_LABEL[cat] || cat) + '</h2>';
      }
      html += '<div class="picks"' + enter(gi + 3) + '>' + groups[cat].map(function (s) {
        return '<button class="pick" data-act="service" data-id="' + s.id + '"' +
          (S.service && S.service.id === s.id ? ' aria-pressed="true"' : '') + '>' +
          MS.photo('service:' + s.category, { glyph: SVC_GLYPH[s.category] || 'drop', zoom: true }) +
          '<span class="pick__name">' + ICON.esc(s.name) + '</span>' +
          '<span class="pick__row"><span>' + s.duration_minutes + ' min' +
            (s.audience !== 'unisex' ? ' &middot; ' + AUDIENCE_LABEL[s.audience] : '') + '</span>' +
          '<b>' + (s.price_minor > 0 ? ICON.esc(ICON.fmtMoney(s.price_minor, S.shop.currency)) : '—') + '</b>' +
          '</span></button>';
      }).join('') + '</div>';
    });

    return html;
  }

  /* ---------- Step: when (booking route) ---------- */

  function stepWhen() {
    var html = backBtn() +
      '<h1 class="step__title"' + enter(1) + '>When suits you?</h1>' +
      '<p class="step__hint"' + enter(2) + '>' +
        ICON.esc(S.service ? S.service.name + ' · ' + S.service.duration_minutes + ' min' : '') +
      '</p>' +
      errorBox();

    // Month calendar, so today and every date in the booking window are
    // reachable — a horizontal strip hid anything past the next fortnight.
    html += monthCalendar();

    // Staff picker, only when there is a real choice
    var team = S.shop.staff || [];
    if (team.length > 1) {
      html += '<div class="field"' + enter(4) + '><label id="staffLabel">With someone in particular?</label>' +
        '<div class="slots" role="group" aria-labelledby="staffLabel">' +
        '<button type="button" class="slot" data-act="staff" data-id=""' +
          (S.staffId ? '' : ' aria-pressed="true"') + '>Anyone</button>' +
        team.map(function (t) {
          return '<button type="button" class="slot" data-act="staff" data-id="' + t.id + '"' +
            (String(S.staffId) === String(t.id) ? ' aria-pressed="true"' : '') + '>' +
            '<span class="ms-mono" aria-hidden="true">' + ICON.esc(initial(t.name)) + '</span>' +
            ICON.esc(t.name) + '</button>';
        }).join('') + '</div></div>';
    }

    // Slot grid for the chosen day
    if (S.day) {
      html += '<h2 class="step__sub" id="slotsTitle">' +
              ICON.esc(ICON.fmtDate(S.day + 'T00:00:00')) +
              (ICON.fmtDate(S.day + 'T00:00:00').length < 9
                ? ' <span class="soft" style="font-weight:500;">' +
                  ICON.esc(ICON.fmtDate(S.day + 'T00:00:00', { absolute: true })) + '</span>'
                : '') + '</h2>';
      if (S.slots === null) {
        html += '<p class="sr" role="status">Loading times…</p>' +
          '<div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
      } else if (S.slots.length === 0) {
        html += '<div class="empty"><strong>No times left</strong>Try another day.</div>';
      } else {
        // Morning / afternoon / evening, so a 12-hour shop isn't one long wall.
        var buckets = [
          { head: 'Morning', from: 0, to: 12, items: [] },
          { head: 'Afternoon', from: 12, to: 17, items: [] },
          { head: 'Evening', from: 17, to: 24, items: [] }
        ];
        S.slots.forEach(function (s) {
          var h = new Date(s.starts_at).getHours();
          var b = buckets.filter(function (x) { return h >= x.from && h < x.to; })[0];
          if (b) b.items.push(s);
        });

        html += buckets.filter(function (b) { return b.items.length; }).map(function (b) {
          return '<div class="slotgroup">' +
            '<div class="slotgroup__head">' + b.head + ' \u00b7 ' + b.items.length + ' free</div>' +
            '<div class="slotgrid">' + b.items.map(function (s) {
              return '<button class="timeslot" data-act="slot" data-at="' + s.starts_at + '"' +
                (S.slot === s.starts_at ? ' aria-pressed="true"' : '') + '>' +
                ICON.esc(ICON.fmtTime(s.starts_at)) + '</button>';
            }).join('') + '</div></div>';
        }).join('');
      }
    }

    return html;
  }

  /* ---------- Month calendar ---------- */

  function firstOfMonth(d) {
    var x = new Date(d); x.setDate(1); x.setHours(0, 0, 0, 0); return x;
  }

  function monthCalendar() {
    if (!S.calMonth) S.calMonth = firstOfMonth(new Date());

    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                  'July', 'August', 'September', 'October', 'November', 'December'];

    var first = S.calMonth;
    var year = first.getFullYear(), month = first.getMonth();
    var pad = new Date(year, month, 1).getDay();
    var daysIn = new Date(year, month + 1, 0).getDate();

    var todayKey = ICON.dateKey(new Date());
    var lastKey = ICON.dateKey(ICON.addDays(new Date(), S.shop.horizon_days || 30));

    // free-slot counts, keyed by date
    var free = {};
    S.calendar.forEach(function (d) {
      free[String(d.on_date).slice(0, 10)] = Number(d.free_slots) || 0;
    });

    // Can we step back/forward a month and still be inside the window?
    var prevMonth = new Date(year, month - 1, 1);
    var prevEnd = new Date(year, month, 0);
    var canPrev = ICON.dateKey(prevEnd) >= todayKey;
    var canNext = ICON.dateKey(new Date(year, month + 1, 1)) <= lastKey;

    // Cells are collected week by week so weeks wholly outside the booking
    // window (the past, or beyond the horizon) can be left off the grid.
    var cells = '';
    var week = [], weekLive = false;
    function flush() {
      if (week.length && weekLive) cells += week.join('');
      week = []; weekLive = false;
    }
    for (var i = 0; i < pad; i++) week.push('<button class="cal__cell" disabled aria-hidden="true" tabindex="-1"></button>');

    for (var d = 1; d <= daysIn; d++) {
      var key = ICON.dateKey(new Date(year, month, d));
      var inWindow = key >= todayKey && key <= lastKey;
      var n = free[key];
      var known = n !== undefined;
      var bookable = inWindow && (!known || n > 0);
      if (inWindow) weekLive = true;

      week.push('<button class="cal__cell' + (key === todayKey ? ' is-today' : '') + '"' +
        ' data-act="calDay" data-date="' + key + '"' +
        (S.day === key ? ' aria-pressed="true"' : '') +
        (bookable ? '' : ' disabled') +
        ' aria-label="' + key + (known ? ', ' + n + ' slots free' : '') + '">' +
        '<span class="cal__num">' + d + '</span>' +
        (known && n > 0
          ? '<span class="cal__count">' + n + '</span>'
          : known ? '<span class="cal__count">\u2014</span>' : '') +
        '</button>');
      if (week.length === 7) flush();
    }
    while (week.length && week.length < 7) {
      week.push('<button class="cal__cell" disabled aria-hidden="true" tabindex="-1"></button>');
    }
    flush();

    return '<div class="cal"' + enter(3) + '>' +
      '<div class="cal__head">' +
        '<button class="btn btn--quiet" data-act="calMonth" data-d="-1"' +
          (canPrev ? '' : ' disabled') + ' aria-label="Previous month">\u2190</button>' +
        '<span class="cal__month">' + MONTHS[month] + ' ' + year + '</span>' +
        '<button class="btn btn--quiet" data-act="calMonth" data-d="1"' +
          (canNext ? '' : ' disabled') + ' aria-label="Next month">\u2192</button>' +
      '</div>' +
      '<div class="cal__grid">' +
        ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (x) {
          return '<div class="cal__dow">' + x + '</div>';
        }).join('') + cells +
      '</div>' +
      '<p class="cal__note">' +
        (S.calendar.length === 0
          ? 'Checking the diary\u2026'
          : 'The number is how many times are free. You can book up to ' +
            (S.shop.horizon_days || 30) + ' days ahead.') +
      '</p>' +
    '</div>';
  }

  /* ---------- Step: details ---------- */

  function stepDetails() {
    var needPhone = !!S.shop.phone_required;
    var html = backBtn() +
      '<h1 class="step__title"' + enter(1) + '>Almost done</h1>' +
      '<p class="step__hint"' + enter(2) + '>Just your name, and anything we should know.</p>' +
      errorBox() +
      recap() +
      // novalidate: keep `required` for screen readers, but let our own
      // checks produce the styled message instead of a native bubble.
      '<form id="finalForm" novalidate' + enter(3) + '>' +
        '<div class="field">' +
          '<label for="fName">Your name</label>' +
          '<input type="text" id="fName" required maxlength="80" autocomplete="name" ' +
            (/name/i.test(S.error) ? 'aria-invalid="true" ' : '') +
            'placeholder="Alex" value="' + ICON.esc(S.name) + '">' +
        '</div>' +
        '<div class="field">' +
          '<label for="fPhone">Mobile number' +
            '<span class="help">' + (needPhone
              ? 'This shop needs a number so they can call you.'
              : 'Optional — only if you want a reminder.') + '</span>' +
          '</label>' +
          '<input type="tel" id="fPhone"' + (needPhone ? ' required' : '') +
            (/number/i.test(S.error) ? ' aria-invalid="true"' : '') +
            ' autocomplete="tel" placeholder="98450 00000" value="' + ICON.esc(S.phone) + '">' +
        '</div>' +
        '<div class="field">' +
          '<label for="fNotes">Anything else?<span class="help">Optional.</span></label>' +
          '<textarea id="fNotes" maxlength="500" placeholder="' +
            (S.route === 'queue' ? '#3 guard on the sides, square back' : 'Running 5 min late is fine') +
            '">' + ICON.esc(S.notes) + '</textarea>' +
        '</div>';

    // Queue route: optional "come back at" time
    if (S.route === 'queue') {
      var slots = ICON.queue.timeSlots(waiting().length, 4);
      html += '<div class="field">' +
        '<label id="cbLabel">When will you get here?</label>' +
        '<div class="slots" role="group" aria-labelledby="cbLabel">' +
          '<button type="button" class="slot" data-act="comeback" data-at=""' +
            (S.comeBack ? '' : ' aria-pressed="true"') + '>Right now</button>' +
          slots.map(function (d) {
            var iso = d.toISOString();
            return '<button type="button" class="slot" data-act="comeback" data-at="' + iso + '"' +
              (S.comeBack === iso ? ' aria-pressed="true"' : '') + '>' +
              ICON.esc(ICON.fmtTime(d)) + '</button>';
          }).join('') +
        '</div>' +
        '<span class="help" style="margin-top:var(--s2);font-size:var(--f-sm);color:var(--c-soft);">' +
          (S.comeBack
            ? 'We’ll keep your place and expect you around ' + ICON.esc(ICON.fmtTime(S.comeBack)) + '.'
            : 'You keep your place and we take you as the chair frees up.') +
        '</span></div>';
    }

    html += '<button type="submit" class="btn btn--accent btn--block btn--lg" id="goBtn"' +
      (S.busy ? ' disabled' : '') + '>' +
      (S.busy ? 'Working…' : (S.route === 'queue' ? 'Join the queue' : 'Confirm booking')) +
      '</button></form>';

    return html;
  }

  function recap() {
    var rows = [];
    if (S.service) {
      rows.push(['Service', S.service.name + ' · ' + S.service.duration_minutes + ' min']);
      if (S.service.price_minor > 0) {
        rows.push(['Price', ICON.fmtMoney(S.service.price_minor, S.shop.currency)]);
      }
    }
    if (S.route === 'book' && S.slot) {
      rows.push(['When', ICON.fmtDate(S.slot) + ', ' + ICON.fmtTime(S.slot)]);
    }
    if (S.route === 'queue') {
      rows.push(['Wait', 'about ' + waitMins() + ' min']);
    }
    if (S.staffId) {
      var t = (S.shop.staff || []).filter(function (x) { return String(x.id) === String(S.staffId); })[0];
      if (t) rows.push(['With', t.name]);
    }
    if (rows.length === 0) return '';

    return '<div class="recap recap--phone"><dl>' + rows.map(function (r) {
      return '<div class="ticket__row"><dt>' + ICON.esc(r[0]) + '</dt><dd>' + ICON.esc(r[1]) + '</dd></div>';
    }).join('') + '</dl></div>';
  }

  /* ---------- Wiring ---------- */

  function wire(name) {
    root.querySelectorAll('[data-act]').forEach(function (el) {
      el.addEventListener('click', onAction);
    });

    var form = document.getElementById('finalForm');
    if (form) {
      form.addEventListener('submit', submit);
      ['fName', 'fPhone', 'fNotes'].forEach(function (id) {
        var i = document.getElementById(id);
        if (!i) return;
        i.addEventListener('input', function () {
          if (id === 'fName') S.name = i.value;
          if (id === 'fPhone') S.phone = i.value;
          if (id === 'fNotes') S.notes = i.value;
        });
      });
    }

    if (name === 'when' && S.calendar.length === 0) loadCalendar();
  }

  async function onAction(e) {
    var el = e.currentTarget;
    var act = el.dataset.act;

    if (act === 'cat') {
      S.category = el.dataset.slug;
      return renderBrowse();
    }

    if (act === 'backCat') {
      S.category = null;
      return renderBrowse();
    }

    if (act === 'clearSearch') {
      query = '';
      S.category = null;
      return renderBrowse();
    }

    if (act === 'shop') {
      var out = await ICON.shop.resolve(el.dataset.slug);
      if (!out.ok) { S.error = out.error; return renderBrowse(); }
      // Keep the shop in the URL so a refresh or a shared link lands here.
      history.replaceState({}, '', '?shop=' + encodeURIComponent(out.shop.slug));
      restart();
      openShop(out.shop);
      return;
    }

    if (act === 'back') {
      // Step 0 with a directory behind us goes back to the shop list.
      if (S.step === 0) {
        if (S.shops.length > 1 && !ICON.shop.slugFromUrl()) {
          S.browsing = true;
          return renderBrowse();
        }
        return;
      }
      return go(-1);
    }

    if (act === 'route') {
      S.route = el.dataset.route;
      S.calendar = [];
      // One audience or none? Skip straight past that question.
      if (audienceOptions().length === 1) S.audience = audienceOptions()[0];
      return go(1);
    }

    if (act === 'bookService') {
      // "Book this" on the shop page: straight to picking a time.
      var sid = Number(el.dataset.id);
      var pick = (S.shop.services || []).filter(function (s) { return s.id === sid; })[0];
      if (!pick) return;
      S.route = 'book';
      var auds = audienceOptions();
      S.audience = auds.indexOf(pick.audience) >= 0 ? pick.audience : (auds.length === 1 ? auds[0] : null);
      S.service = pick;
      S.day = null; S.slot = null; S.slots = []; S.calendar = [];
      S.step = steps().indexOf('when');
      S.error = '';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (act === 'svcCat') {
      // Filter the menu in place; no re-render, so nothing jumps.
      svcCat = el.dataset.cat;
      document.querySelectorAll('[data-act="svcCat"]').forEach(function (b) {
        b.setAttribute('aria-pressed', b === el ? 'true' : 'false');
      });
      var n = 0;
      document.querySelectorAll('.svc[data-cat]').forEach(function (c) {
        var show = svcCat === 'all' || c.dataset.cat === svcCat;
        c.hidden = !show;
        c.classList.remove('is-shown');
        if (show) { c.style.setProperty('--i', Math.min(n++, 8)); void c.offsetWidth; c.classList.add('is-shown'); }
      });
      placeSeg();
      return;
    }

    if (act === 'audience') {
      S.audience = el.dataset.aud;
      S.service = null;
      return go(1);
    }

    if (act === 'service') {
      var id = Number(el.dataset.id);
      S.service = (S.shop.services || []).filter(function (s) { return s.id === id; })[0] || null;
      S.day = null; S.slot = null; S.slots = []; S.calendar = [];
      return go(1);
    }

    if (act === 'staff') {
      S.staffId = el.dataset.id || null;
      S.slot = null;
      if (S.day) await loadSlots();
      S.calendar = [];
      await loadCalendar();
      return;
    }

    if (act === 'calDay') {
      S.day = el.dataset.date;
      S.slot = null;
      S.slots = null;
      render();
      return loadSlots();
    }

    if (act === 'calMonth') {
      var m = new Date(S.calMonth);
      m.setMonth(m.getMonth() + Number(el.dataset.d));
      S.calMonth = firstOfMonth(m);
      render();
      return loadCalendar({ keepDay: true });
    }

    if (act === 'slot') {
      S.slot = el.dataset.at;
      render();
      return go(1);
    }

    if (act === 'comeback') {
      S.comeBack = el.dataset.at || null;
      return render();
    }

    if (act === 'addCal') {
      var bk = ICON.book.mine();
      if (bk) downloadIcs(bk);
      return;
    }

    if (act === 'restart') return restart();

    if (act === 'dropTicket') {
      if (!(await MS.confirm({ title: 'Give up your place?', text: 'You’ll leave the line and lose your spot.', ok: 'Leave the line', cancel: 'Stay in line', danger: true }))) return;
      ICON.ticket.forget();
      restart();
      return refreshQueue();
    }

    if (act === 'cancelBooking') {
      if (!(await MS.confirm({ title: 'Cancel this booking?', text: 'Your time will be released for someone else.', ok: 'Cancel booking', cancel: 'Keep it', danger: true }))) return;
      var b = ICON.book.mine();
      if (!b) return restart();
      var out = await ICON.book.cancel(b.lookup_code);
      if (!out.ok) { S.error = out.error; return render(); }
      restart();
    }
  }

  // Fetches free-slot counts for the month on screen, clamped to today and
  // the shop's booking window so we never ask for dates it won't sell.
  async function loadCalendar(opts) {
    if (!S.calMonth) S.calMonth = firstOfMonth(new Date());

    var today = new Date(); today.setHours(0, 0, 0, 0);
    var monthStart = new Date(S.calMonth);
    var monthEnd = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 0);
    var from = monthStart < today ? today : monthStart;

    var horizonEnd = ICON.addDays(today, S.shop.horizon_days || 30);
    var to = monthEnd > horizonEnd ? horizonEnd : monthEnd;

    var days = Math.floor((to - from) / 86400000) + 1;
    if (days < 1) { S.calendar = []; return render(); }

    var out = await ICON.book.calendar(
      ICON.dateKey(from),
      Math.min(days, 60),
      S.service && S.service.id
    );

    if (!out.ok) { S.error = out.error; return render(); }

    S.calendar = out.data;

    // Land on the first day with room, so a tap on a time is the next thing.
    if (!S.day && !(opts && opts.keepDay)) {
      var firstFree = out.data.filter(function (d) { return Number(d.free_slots) > 0; })[0];
      if (firstFree) {
        S.day = String(firstFree.on_date).slice(0, 10);
        S.slots = null;
        render();
        return loadSlots();
      }
    }
    render();
  }

  async function loadSlots() {
    var out = await ICON.book.slots(S.day, S.service && S.service.id, S.staffId);
    S.slots = out.ok ? out.data : [];
    if (!out.ok) S.error = out.error;
    render();
  }

  /* ---------- Submit ---------- */

  async function submit(e) {
    e.preventDefault();
    S.error = '';

    S.name = (document.getElementById('fName') || {}).value || S.name;
    S.phone = (document.getElementById('fPhone') || {}).value || '';
    S.notes = (document.getElementById('fNotes') || {}).value || '';

    if (String(S.name).trim().length < 2) {
      S.error = 'Enter your name.';
      return render();
    }

    var hasPhone = String(S.phone).trim().length > 0;
    if (S.shop.phone_required && !hasPhone) {
      S.error = 'This shop needs a mobile number.';
      return render();
    }
    if (hasPhone && !ICON.isValidPhone(S.phone)) {
      S.error = 'That number doesn’t look right. Use 10 to 15 digits, or clear it.';
      return render();
    }

    S.busy = true; render();

    var out;
    if (S.route === 'queue') {
      out = await ICON.queue.join({
        name: S.name.trim(), phone: S.phone, notes: S.notes,
        preferredTime: S.comeBack,
        serviceId: S.service && S.service.id,
        serviceName: S.service && S.service.name,
        staffId: S.staffId
      });
    } else {
      if (!S.slot) { S.busy = false; S.error = 'Pick a time first.'; return render(); }
      out = await ICON.book.create({
        serviceId: S.service && S.service.id,
        startsAt: S.slot, name: S.name.trim(), phone: S.phone,
        notes: S.notes, staffId: S.staffId
      });
    }

    S.busy = false;

    if (!out.ok) {
      S.error = out.error;
      // The slot went while they were typing — send them back to pick again.
      if (/just been taken/i.test(out.error)) {
        S.slot = null; S.slots = null;
        S.step = steps().indexOf('when');
        loadSlots();
      }
      return render();
    }

    await refreshQueue();
  }

  /* ---------- Live ticket (queue route) ---------- */

  function renderTicket(mine) {
    var row = S.rows.filter(function (r) { return Number(r.id) === Number(mine.entry_id); })[0];
    if (!row) { ICON.ticket.forget(); return restart(); }

    var isUp = row.status === 'in_chair';
    var pos = isUp ? 0 : ICON.queue.positionOf(S.rows, mine.entry_id);
    var ahead = Math.max(0, pos - 1);

    paint('<div class="passview"><div class="passview__in">' +
      '<header class="done"' + enter(0) + '>' + '<svg class="ms-check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>' +
        '<h1>' + (isUp ? 'You\u2019re up.' : 'You\u2019re in line.') + '</h1>' +
        '<p>' + ICON.esc((S.shop && S.shop.name) || '') + '</p>' +
      '</header>' +
      '<div class="ticket" id="tk"' + enter(1) + '>' +
        '<div class="ticket__head">' +
          '<span class="wordmark" style="font-size:var(--t-sm);">Icon</span>' +
          '<span class="chip ' + (isUp ? 'chip--go' : 'chip--wait') + '">' +
            (isUp ? 'In the chair' : 'In line') + '</span>' +
        '</div>' +

        '<div class="band">Ticket for today' +
          (mine.service_name ? ' <span>' + ICON.esc(mine.service_name) + '</span>' : '') +
        '</div>' +

        '<div class="ticket__number num' + (isUp ? '' : ' is-waiting') + '">' +
          ICON.padTicket(row.ticket_no) + '</div>' +

        '<p class="hero__sub">' +
          (isUp ? '<strong>You\u2019re up.</strong> Head to the chair.'
                : pos === 1 ? '<strong>You\u2019re next.</strong> Stay close by.'
                : '<strong>' + pos + ordinal(pos) + ' in line.</strong> About ' +
                  ICON.fmtTime(ICON.queue.etaFor(pos))) +
        '</p>' +

        // Position as a picture, so it reads without doing arithmetic.
        pipsFor(isUp, ahead) +

        // A walk-in has no booking reference, so this code carries the shop's
        // link: show it to a friend and they land straight on this shop.
        passBlock(null, {
          id: 'ticketQr',
          caption: 'Scan to open this shop — book again or share it',
          ref: (S.shop && S.shop.name) || 'ICON'
        }) +

        '<div class="ticket__tear"></div>' +

        '<div class="ticket__stub">' +
          '<dl style="margin:0;">' +
            row2('Name', row.customer_name) +
            (mine.service_name ? row2('Service', mine.service_name) : '') +
            row2(isUp ? 'Started' : 'Ahead of you',
                 isUp ? ICON.fmtTime(row.called_at)
                      : (ahead === 0 ? 'Nobody \u2014 you\u2019re next'
                                     : ahead + (ahead === 1 ? ' person' : ' people'))) +
            row2('Estimated', isUp ? 'Now' : 'about ' + ICON.fmtTime(ICON.queue.etaFor(pos))) +
            (row.preferred_time ? row2('You said', ICON.fmtTime(row.preferred_time)) : '') +
            (mine.notes ? row2('Notes', mine.notes) : '') +
          '</dl>' +
          (isUp ? '' :
            '<div class="acts">' +
              '<button class="btn btn--quiet" data-act="dropTicket">Give up my place</button>' +
            '</div>') +
        '</div>' +
      '</div>' +

      '<p class="foot"' + enter(2) + '>This updates on its own. Keep the page open.</p>' +
      '</div></div>', 'ticket');

    drawQr('ticketQr', shopUrl(), 'QR code to open this shop');

    root.querySelectorAll('[data-act]').forEach(function (el) {
      el.addEventListener('click', onAction);
    });
  }

  /* ---------- The booking pass ---------- */

  // The link the QR carries. Scanning it reopens this exact booking,
  // which is what makes the code worth printing rather than decorative.
  function passUrl(code, slug) {
    var base = location.origin + location.pathname;
    return base + '?shop=' + encodeURIComponent(slug || (S.shop && S.shop.slug) || '') +
           '&ref=' + encodeURIComponent(code);
  }

  // The walk-in equivalent. A walk-in has no lookup code, so its QR carries
  // the shop's own link: scanning it reopens this shop to book or re-join,
  // which is the useful thing to hand someone off a paper ticket.
  function shopUrl(slug) {
    var base = location.origin + location.pathname;
    return base + '?shop=' + encodeURIComponent(slug || (S.shop && S.shop.slug) || '');
  }

  function passBlock(code, opts) {
    opts = opts || {};
    return '<div class="pass">' +
      '<div id="' + (opts.id || 'passCode') + '"></div>' +
      '<p class="pass__ref">' + ICON.esc(opts.caption || 'Show this at the counter') +
        '<strong>' + ICON.esc(opts.ref || String(code).slice(0, 6).toUpperCase()) + '</strong>' +
      '</p>' +
    '</div>';
  }

  // Draws the code into #passCode. On failure it says WHY on screen: a
  // silently missing QR is indistinguishable from a stale deployment, and
  // that ambiguity costs more than the ugly message does.
  function drawQr(boxId, url, label) {
    var box = document.getElementById(boxId);
    if (!box) return;

    function fail(reason, hint) {
      box.className = '';
      box.innerHTML =
        '<p class="pass__fallback"><strong>No QR code.</strong> ' + ICON.esc(reason) +
        (hint ? '<code>' + ICON.esc(hint) + '</code>' : '') + '</p>';
      console.error('[ICON] QR not drawn: ' + reason);
    }

    // Show something immediately; the library may still be arriving.
    box.className = '';
    box.innerHTML = '<p class="pass__fallback">Drawing code…</p>';

    var ready = window.ICON_QR_READY ||
      Promise.resolve(typeof window.qrcode === 'function');

    ready.then(function (ok) {
      if (!ok || typeof window.qrcode !== 'function') {
        return fail(
          'The QR library could not be loaded, so the reference below is all we can show.',
          'vendor/qrcode.js is missing and the CDN copy was blocked too.'
        );
      }
      try {
        var q = window.qrcode(0, 'M');   // 0 = auto size, M = survives print wear
        q.addData(url);
        q.make();
        box.className = 'pass__code';
        box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
        var svg = box.querySelector('svg');
        if (svg) {
          svg.setAttribute('role', 'img');
          svg.setAttribute('aria-label', label || 'QR code');
        }
      } catch (err) {
        console.error(err);
        fail('The code could not be generated on this device.',
             String(err && err.message || err));
      }
    });
  }

  function drawPass(code, slug) {
    drawQr('passCode', passUrl(code, slug),
      'QR code for booking reference ' + String(code).slice(0, 6).toUpperCase());
  }

  /* ---------- Add to calendar ---------- */
  // A plain .ics built here, so it works with no server and no account.

  function icsEscape(t) {
    return String(t || '').replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }

  function icsStamp(d) {
    // UTC basic format: 20261021T093000Z
    return new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  }

  function downloadIcs(b) {
    var shopName = (S.shop && S.shop.name) || 'ICON';
    var lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//ICON//booking//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + b.lookup_code + '@icon',
      'DTSTAMP:' + icsStamp(new Date()),
      'DTSTART:' + icsStamp(b.starts_at),
      'DTEND:' + icsStamp(b.ends_at),
      'SUMMARY:' + icsEscape((b.service || 'Appointment') + ' at ' + shopName),
      'DESCRIPTION:' + icsEscape(
        'Booking reference ' + String(b.lookup_code).slice(0, 6).toUpperCase() +
        '\nOpen your booking: ' + passUrl(b.lookup_code, b.shop_slug)),
      'URL:' + passUrl(b.lookup_code, b.shop_slug),
      'END:VEVENT',
      'END:VCALENDAR'
    ];

    try {
      var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'icon-booking.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (err) {
      console.error('[ICON] could not build the calendar file:', err);
      alert('Could not create the calendar file on this device.');
    }
  }

  /* ---------- Booking confirmation ---------- */

  function renderBooking(b) {
    // Older stored bookings predate shop_slug; fall back to the open shop.
    if (!b.shop_slug && S.shop) b.shop_slug = S.shop.slug;

    var mins = Math.max(1, Math.round(
      (new Date(b.ends_at) - new Date(b.starts_at)) / 60000));
    var soon = new Date(b.starts_at) - Date.now();
    var isToday = ICON.fmtDate(b.starts_at) === 'Today';

    paint('<div class="passview"><div class="passview__in">' +
      '<header class="done"' + enter(0) + '>' + '<svg class="ms-check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>' +
        '<h1>You\u2019re booked.</h1>' +
        '<p>' + ICON.esc(ICON.fmtDate(b.starts_at, { absolute: true })) + ' at ' + ICON.esc((S.shop && S.shop.name) || '') + '</p>' +
      '</header>' +
      '<div class="ticket"' + enter(1) + '>' +
        '<div class="ticket__head">' +
          '<span class="wordmark" style="font-size:var(--t-sm);">Icon</span>' +
          '<span class="chip chip--go">Booked</span>' +
        '</div>' +

        bandFor(b.starts_at) +

        '<div class="ticket__number num" ' +
          'style="font-size:clamp(2.6rem,11vw,4rem);padding:var(--s5) var(--s4) var(--s2);">' +
          ICON.esc(ICON.fmtTime(b.starts_at)) + '</div>' +

        '<p class="hero__sub">' +
          '<strong>' + ICON.esc(b.service || 'Appointment') + '</strong>' +
          ' \u00b7 ' + mins + ' min \u00b7 ends ' + ICON.esc(ICON.fmtTime(b.ends_at)) +
          (isToday && soon > 0
            ? '<br>In about ' + Math.max(1, Math.round(soon / 60000)) + ' min'
            : '') +
        '</p>' +

        '<div class="ticket__tear"></div>' +

        '<div class="ticket__stub">' +
          passBlock(b.lookup_code) +
          '<dl style="margin:var(--s4) 0 0;">' +
            row2('Name', b.name) +
            (b.price_minor > 0
              ? row2('Price', ICON.fmtMoney(b.price_minor, S.shop && S.shop.currency))
              : '') +
            row2('Where', (S.shop && S.shop.name) || '') +
          '</dl>' +
          '<div class="acts acts--two">' +
            '<button class="btn" data-act="addCal">Add to calendar</button>' +
            '<button class="btn btn--quiet" data-act="cancelBooking">Cancel booking</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<p class="foot"' + enter(2) + '>Keep this on your phone \u2014 the desk can scan it.<br>' +
        '<button class="textlink" data-act="restart">' +
        'Book something else</button></p>' +
      '</div></div>', 'booking');

    drawPass(b.lookup_code, b.shop_slug);

    root.querySelectorAll('[data-act]').forEach(function (el) {
      el.addEventListener('click', onAction);
    });
  }

  /* ---------- A scanned booking ---------- */
  // Reached by scanning the QR (?ref=<code>), typically by the desk on a
  // different device. Read-only: it shows the booking without touching
  // whatever booking this browser has of its own.

  function renderScanned(d) {
    var cur = d.currency || '\u20ac';
    var live = d.status === 'booked' || d.status === 'arrived' || d.status === 'in_chair';

    paint('<div class="passview"><div class="passview__in">' +
      '<div class="ticket"' + enter(0) + '>' +
        '<div class="ticket__head">' +
          '<span class="wordmark" style="font-size:var(--t-sm);">Icon</span>' +
          '<span class="chip ' + (live ? 'chip--go' : 'chip--off') + '">' + ICON.esc(statusLabel(d.status)) + '</span>' +
        '</div>' +
        '<div class="ticket__number num' + (live ? '' : ' is-waiting') +
          '" style="font-size:clamp(2.4rem,10vw,3.6rem);padding-top:var(--s5);">' +
          ICON.esc(ICON.fmtTime(d.starts_at)) + '</div>' +
        '<p class="ticket__caption"><strong>' + ICON.esc(ICON.fmtDate(d.starts_at)) + '</strong>' +
          ' at ' + ICON.esc(d.shop || '') + '</p>' +
        '<div class="ticket__tear"></div>' +
        '<div class="ticket__stub">' +
          '<dl style="margin:0 0 var(--s4);">' +
            row2('Name', d.customer_name) +
            (d.service ? row2('Service', d.service) : '') +
            (d.price_minor > 0 ? row2('Price', ICON.fmtMoney(d.price_minor, cur)) : '') +
            row2('Ends', ICON.fmtTime(d.ends_at)) +
            (d.staff ? row2('With', d.staff) : '') +
            (d.notes ? row2('Notes', d.notes) : '') +
            row2('Status', statusLabel(d.status)) +
          '</dl>' +
          '<a class="btn btn--quiet btn--block" href="./index.html?shop=' +
            encodeURIComponent(d.shop_slug || '') + '">Open the shop page</a>' +
        '</div>' +
      '</div>' +
      '</div></div>', 'scanned');
  }

  function statusLabel(st) {
    return ({
      booked: 'Booked', arrived: 'Arrived', in_chair: 'In the chair',
      done: 'Finished', cancelled: 'Cancelled', no_show: 'No show'
    })[st] || st;
  }

  function renderClosed() {
    var tel = S.shop.contact_phone ? String(S.shop.contact_phone).replace(/[^0-9+]/g, '') : '';
    paint(
      hero(
        (tel
          ? '<div class="shero__acts"' + enter(3) + '><a class="ms-btn ms-btn--accent ms-btn--lg" data-magnetic href="tel:' + ICON.esc(tel) + '">Call ' +
              ICON.esc(ICON.fmtPhone(S.shop.contact_phone)) + '</a></div>'
          : '') +
        '<p class="shero__hint"' + enter(3) + '>This shop isn’t taking walk-ins or bookings right now. ' +
          (tel ? 'Call if you need them.' : 'Check back during opening hours.') + '</p>') +
      sections(false) +
      footer(), 'closed');
  }

  function hoursTable() {
    var hours = S.shop.hours || [];
    if (!hours.length) return '<p class="mempty" style="margin-top:1.5rem;">The shop hasn’t listed its hours yet.</p>';
    var today = new Date().getDay();
    var st = shopStatus();
    return '<table class="hours">' +
      '<caption><span class="' + (st.open ? 'is-open' : 'is-closed') + '">' + ICON.esc(st.text) + '</span></caption>' +
      '<tbody>' + hours.map(function (h) {
        var isToday = h.weekday === today;
        return '<tr' + (isToday ? ' class="is-today"' : '') + '>' +
          '<th scope="row">' + ICON.fmtDay(h.weekday, true) + (isToday ? '<span class="today">Today</span>' : '') + '</th>' +
          '<td' + (h.is_open ? '' : ' class="is-off"') + '>' +
            (h.is_open ? ICON.esc(clock(h.opens_at)) + ' – ' + ICON.esc(clock(h.closes_at)) : 'Closed') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* ---------- Bits ---------- */

  // fmtDate already collapses to "Today"/"Tomorrow", so only add the
  // absolute date when it would say something different.
  function bandFor(when) {
    var rel = ICON.fmtDate(when);
    var abs = ICON.fmtDate(when, { absolute: true });
    return '<div class="band">' + ICON.esc(rel) +
      (rel === abs ? '' : ' <span>' + ICON.esc(abs) + '</span>') +
      '</div>';
  }

  // One pip per person ahead, then a ring for you. Long queues are capped
  // so the row cannot wrap into a wall of dots.
  function pipsFor(isUp, ahead) {
    if (isUp) return '<div class="pips"><i class="is-chair"></i></div>';

    var CAP = 12;
    var shown = Math.min(ahead, CAP);
    var dots = '';
    for (var i = 0; i < shown; i++) dots += '<i></i>';

    return '<div class="pips" role="img" aria-label="' +
      (ahead === 0 ? 'You are next' : ahead + ' ahead of you') + '">' +
      dots + '<i class="is-me"></i>' +
      (ahead > CAP
        ? '<span class="muted" style="font-size:var(--t-xs);margin-left:4px;">+' +
          (ahead - CAP) + '</span>'
        : '') +
    '</div>';
  }

  function row2(k, v) {
    return '<div class="ticket__row"><dt>' + ICON.esc(k) + '</dt><dd>' + ICON.esc(v) + '</dd></div>';
  }

  function ordinal(n) {
    if (n % 100 >= 11 && n % 100 <= 13) return 'th';
    return ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  }
})();
</script>
</body>
</html>
