<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON — The chair</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./icon.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  /* Nothing renders until we know who is signed in. */
  body[data-gate="pending"] .gated { visibility: hidden; }
</style>
</head>
<body data-gate="pending">

<header class="bar">
  <span class="wordmark">Icon</span>
  <nav>
    <a href="./admin.html" aria-current="page">The chair</a>
    <a href="./tv.html" target="_blank" rel="noopener">Board</a>
    <span class="muted" style="color: var(--on-ink-dim); font-size: var(--t-sm);" id="who"></span>
    <button class="btn btn--quiet" id="signOutBtn"
            style="color: var(--on-ink); border-color: var(--ink-line); padding: 0.35rem 0.7rem; font-size: var(--t-sm);">
      Sign out
    </button>
  </nav>
</header>

<main class="shell gated">
  <div class="split">

    <!-- ============ Queue ============ -->
    <section>
      <div class="spread" style="margin-bottom: var(--s4);">
        <div>
          <h1 style="font-size: var(--t-xl);">Today's line</h1>
          <p class="muted" style="margin: var(--s1) 0 0; font-size: var(--t-sm);" id="summary">Loading…</p>
        </div>
        <button class="btn btn--danger" id="purgeBtn" hidden>Clear the line</button>
      </div>

      <p class="msg msg--bad" id="queueMsg" hidden></p>

      <div class="queue" id="queue"></div>
    </section>

    <!-- ============ Walk-in desk ============ -->
    <aside>
      <form class="ticket" id="walkInForm">
        <div class="ticket__head">
          <span class="label">Walk-in desk</span>
        </div>
        <div class="ticket__stub">
          <p class="msg msg--bad" id="deskMsg" hidden></p>

          <div class="field">
            <label for="custName">Name</label>
            <input type="text" id="custName" required maxlength="80" placeholder="John Doe">
          </div>

          <div class="field">
            <label for="custPhone">Mobile number</label>
            <input type="tel" id="custPhone" required placeholder="(404) 555-0199">
          </div>

          <div class="field">
            <label for="custNotes">Cut notes
              <span class="help">Optional.</span>
            </label>
            <textarea id="custNotes" maxlength="500" placeholder="#4 guard fade, trim the top"></textarea>
          </div>

          <div class="field">
            <label id="deskWhenLabel">Coming in</label>
            <div class="slots" id="deskSlots" role="group" aria-labelledby="deskWhenLabel"></div>
          </div>

          <button type="submit" class="btn btn--block btn--lg btn--go" id="addBtn">Add to the line</button>
        </div>
      </form>
    </aside>
  </div>
</main>

<script src="./config.js"></script>
<script src="./icon.js"></script>
<script>
(function () {
  'use strict';
  if (!window.ICON) return;
  var ICON = window.ICON;

  var queueEl = document.getElementById('queue');
  var summaryEl = document.getElementById('summary');
  var queueMsg = document.getElementById('queueMsg');
  var deskMsg = document.getElementById('deskMsg');
  var addBtn = document.getElementById('addBtn');
  var deskSlots = document.getElementById('deskSlots');
  var purgeBtn = document.getElementById('purgeBtn');

  var staff = null;
  var deskTime = null;

  function say(el, text, good) {
    el.textContent = text;
    el.hidden = !text;
    el.className = 'msg ' + (good ? 'msg--good' : 'msg--bad');
  }

  function bounceToLogin() {
    location.replace('./login.html?next=admin.html');
  }

  /* ---------- Render the line ---------- */

  async function render() {
    var out = await ICON.admin.queue();

    if (!out.ok) {
      if (out.expired) return bounceToLogin();
      say(queueMsg, out.error);
      return;
    }
    say(queueMsg, '');

    var rows = out.data || [];
    var waiting = rows.filter(function (r) { return r.status === 'waiting'; });
    var inChair = rows.filter(function (r) { return r.status === 'in_chair'; });

    summaryEl.textContent = rows.length === 0
      ? 'Nobody in the shop.'
      : waiting.length + ' waiting · ' + inChair.length + ' in the chair · about ' +
        ICON.estimateWaitMinutes(waiting.length) + ' min for a new walk-in';

    if (rows.length === 0) {
      queueEl.innerHTML =
        '<div class="empty"><strong>The line is empty</strong>' +
        'Add a walk-in from the desk, or wait for an online ticket.</div>';
      buildDeskSlots(0);
      return;
    }

    var seen = 0;
    var html = '';

    rows.forEach(function (row) {
      var active = row.status === 'in_chair';
      if (!active) seen += 1;

      var eta = active ? null : ICON.etaFor(seen);
      var meta = [];
      meta.push(active
        ? 'In the chair since ' + ICON.esc(ICON.fmtTime(row.called_at))
        : seen + ordinal(seen) + ' · about ' + ICON.esc(ICON.fmtTime(eta)));
      meta.push(ICON.esc(row.phone_number ? ICON.fmtPhone(row.phone_number) : 'no number'));
      meta.push('joined ' + ICON.esc(ICON.fmtRelative(row.join_time)));
      if (row.preferred_time) {
        meta.push('asked for ' + ICON.esc(ICON.fmtTime(row.preferred_time)));
      }

      html +=
        '<div class="entry' + (active ? ' is-active' : '') + '">' +
          '<div class="entry__ticket num">' + ICON.padTicket(row.ticket_no) + '</div>' +
          '<div>' +
            '<div class="entry__name">' + ICON.esc(row.customer_name) + '</div>' +
            '<div class="entry__meta">' + meta.map(function (m) {
              return '<span>' + m + '</span>';
            }).join('') + '</div>' +
            (row.clip_notes
              ? '<span class="entry__note">' + ICON.esc(row.clip_notes) + '</span>'
              : '') +
          '</div>' +
          '<div class="entry__actions">' +
            (active
              ? '<button class="btn btn--go" data-do="done" data-id="' + Number(row.id) + '">Finished</button>'
              : '<button class="btn" data-do="call" data-id="' + Number(row.id) + '">Call to chair</button>') +
            '<button class="btn btn--quiet" data-do="drop" data-id="' + Number(row.id) + '">Remove</button>' +
          '</div>' +
        '</div>';
    });

    queueEl.innerHTML = html;
    buildDeskSlots(waiting.length);
  }

  function ordinal(n) {
    if (n % 100 >= 11 && n % 100 <= 13) return 'th';
    return ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  }

  /* ---------- Queue actions ---------- */

  queueEl.addEventListener('click', async function (e) {
    var btn = e.target.closest('button[data-do]');
    if (!btn) return;

    var id = Number(btn.dataset.id);
    var map = { call: 'in_chair', done: 'done', drop: 'cancelled' };
    var status = map[btn.dataset.do];
    if (!status) return;

    if (status === 'cancelled' && !confirm('Remove this person from the line?')) return;

    Array.prototype.forEach.call(queueEl.querySelectorAll('button'), function (b) { b.disabled = true; });

    var out = await ICON.admin.setStatus(id, status);
    if (!out.ok) {
      if (out.expired) return bounceToLogin();
      say(queueMsg, out.error);
    }
    render();
  });

  /* ---------- Walk-in desk ---------- */

  function buildDeskSlots(waitingCount) {
    if (document.activeElement && deskSlots.contains(document.activeElement)) return;
    var slots = ICON.timeSlots(waitingCount, 3);
    var html = '<button type="button" class="slot" data-when="asap" aria-pressed="' +
               (deskTime ? 'false' : 'true') + '">Now</button>';
    slots.forEach(function (d) {
      var iso = d.toISOString();
      html += '<button type="button" class="slot" data-when="' + iso + '" aria-pressed="' +
              (deskTime === iso ? 'true' : 'false') + '">' + ICON.esc(ICON.fmtTime(d)) + '</button>';
    });
    deskSlots.innerHTML = html;
  }

  deskSlots.addEventListener('click', function (e) {
    var btn = e.target.closest('.slot');
    if (!btn) return;
    Array.prototype.forEach.call(deskSlots.querySelectorAll('.slot'), function (b) {
      b.setAttribute('aria-pressed', String(b === btn));
    });
    deskTime = btn.dataset.when === 'asap' ? null : btn.dataset.when;
  });

  document.getElementById('walkInForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    say(deskMsg, '');

    var name = document.getElementById('custName').value.trim();
    var phone = document.getElementById('custPhone').value;
    var notes = document.getElementById('custNotes').value.trim();

    if (name.length < 2) return say(deskMsg, 'Enter the customer’s name.');
    if (!ICON.isValidPhone(phone)) return say(deskMsg, 'Enter a mobile number with 10 to 15 digits.');

    addBtn.disabled = true;
    addBtn.textContent = 'Adding…';

    var out = await ICON.admin.register(name, phone, notes, deskTime);

    addBtn.disabled = false;
    addBtn.textContent = 'Add to the line';

    if (!out.ok) {
      if (out.expired) return bounceToLogin();
      return say(deskMsg, out.error);
    }

    say(deskMsg, 'Ticket ' + ICON.padTicket(out.data.ticket_no) + ' added for ' + name + '.', true);
    this.reset();
    deskTime = null;
    render();
  });

  /* ---------- Clear the line ---------- */

  purgeBtn.addEventListener('click', async function () {
    if (!confirm('Close out everyone currently in the shop? This cannot be undone.')) return;

    var out = await ICON.admin.purge();
    if (!out.ok) {
      if (out.expired) return bounceToLogin();
      return say(queueMsg, out.error);
    }
    say(queueMsg, 'Cleared ' + out.data + (out.data === 1 ? ' ticket.' : ' tickets.'), true);
    render();
  });

  /* ---------- Sign out ---------- */

  document.getElementById('signOutBtn').addEventListener('click', async function () {
    await ICON.auth.logout();
    location.replace('./login.html');
  });

  /* ---------- Boot: gate first, then render ---------- */

  (async function start() {
    staff = await ICON.auth.require('./login.html');
    if (!staff) return;  // require() already redirected

    document.body.dataset.gate = 'open';
    document.getElementById('who').textContent = staff.display_name + ' · ' + staff.role;

    // Only managers and owners get the destructive control.
    purgeBtn.hidden = !(staff.role === 'manager' || staff.role === 'owner');

    ICON.subscribeQueue('desk-queue', render);
  })();
})();
</script>
</body>
</html>
