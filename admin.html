<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON — Shop console</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Inter+Tight:wght@400..700&display=swap">
<link rel="stylesheet" href="./icon.css">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./console.css">
<meta name="theme-color" content="#1D1B18">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./vendor/qrcode.js"></script>
<style>
  body[data-gate="pending"] .gated { visibility: hidden; }
</style>
</head>
<body class="cs" data-gate="pending">

<header class="cs-bar">
  <div class="cs-bar__in">
    <div class="cs-brand">
      <span class="wordmark" id="shopName">Icon</span>
      <small>Shop console</small>
    </div>
    <nav aria-label="Console">
      <a href="#" class="cs-link" id="viewLink" target="_blank" rel="noopener" aria-label="Customer view (opens in a new tab)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Customer view</span></a>
      <a href="#" class="cs-link" id="boardLink" target="_blank" rel="noopener" aria-label="Live board (opens in a new tab)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Live board</span></a>
      <div class="cs-who" id="who"></div>
      <button class="ms-btn ms-btn--ghost ms-btn--sm" id="signOut">Sign out</button>
    </nav>
  </div>
</header>

<div class="cs-tabs-wrap gated">
  <div class="cs-tabs" role="tablist" aria-label="Console sections" id="tabs"></div>
</div>

<main class="cs-main gated">
  <p class="msg msg--bad" id="topMsg" role="status" hidden></p>
  <div id="panel"></div>
</main>

<script src="./config.js"></script>
<script src="./icon.js"></script>
<script src="./ui.js"></script>
<script>
(function () {
  'use strict';
  if (!window.ICON) return;
  var ICON = window.ICON;

  var panel = document.getElementById('panel');
  var tabsEl = document.getElementById('tabs');
  var topMsg = document.getElementById('topMsg');

  var TABS = [
    { id: 'line',     label: 'The line' },
    { id: 'calendar', label: 'Calendar' },
    { id: 'services', label: 'Services', manager: true },
    { id: 'team',     label: 'Team',     manager: true },
    { id: 'hours',    label: 'Hours',    manager: true },
    { id: 'qr',       label: 'QR code' },
    { id: 'shop',     label: 'Shop',     manager: true }
  ];

  var S = {
    staff: null, shop: null, tab: 'line',
    queue: [], appts: [], apptDay: ICON.dateKey(new Date()),
    calMonth: null, counts: {},
    services: [], team: [], hours: [], closures: [],
    deskTime: null, deskService: null,
    editService: null, editStaff: null,
    bookSlots: null, bookService: null, bookStaff: null, bookSlot: null, bookOpen: false
  };

  var AUD = ['men', 'women', 'kids', 'unisex'];
  var CAT = ['hair', 'beard', 'nails', 'skin', 'spa', 'other'];
  var KINDS = ['barber', 'salon', 'nails', 'spa', 'carwash'];
  var CATEGORIES = [
    { slug: 'barbers',    name: 'Barbers' },
    { slug: 'nail-salon', name: 'Nail salons' },
    { slug: 'car-wash',   name: 'Car wash' }
  ];

  /* ---------- Helpers ---------- */

  function say(text, good) {
    topMsg.textContent = text || '';
    topMsg.hidden = !text;
    topMsg.className = 'msg ' + (good ? 'msg--good' : 'msg--bad');
    if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function bounce() { location.replace('./login.html?next=admin.html'); }

  // Every staff call funnels through here so an expired session is
  // handled in exactly one place.
  async function call(promise) {
    var out = await promise;
    if (!out.ok) {
      if (out.expired) { bounce(); return null; }
      say(out.error);
      return null;
    }
    return out;
  }

  function money(minor) { return ICON.fmtMoney(minor, S.shop && S.shop.currency); }

  function audTag(a) {
    return '<span class="tag tag--' + a + '">' + a.charAt(0).toUpperCase() + a.slice(1) + '</span>';
  }

  function ordinal(n) {
    if (n % 100 >= 11 && n % 100 <= 13) return 'th';
    return ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  }

  function esc(v) { return ICON.esc(v); }

  /* ---------- Icons (one outline set, drawn inline) ---------- */

  var ICONS = {
    line: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    services: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
    team: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    hours: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 20h4v-3"/>',
    shop: '<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    empty: '<path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>'
  };
  // A barber chair: back, seat, arm and pump, for the chairs strip.
  var CHAIR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="2" width="10" height="3" rx="1.5"/>' +
    '<path d="M7 6h10a1 1 0 0 1 1 1v7H6V7a1 1 0 0 1 1-1z"/><rect x="3" y="13" width="18" height="4" rx="2"/>' +
    '<rect x="11" y="17" width="2" height="4"/><rect x="6" y="21" width="12" height="2" rx="1"/></svg>';

  function icon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Counts a figure up or down to its new value when it changes, the
  // way magicui's number-ticker does; instant under reduced motion.
  var lastFigures = {};
  function tick(root) {
    root.querySelectorAll('[data-tick]').forEach(function (el) {
      var key = el.dataset.tick;
      var to = Number(el.textContent);
      var from = lastFigures[key];
      lastFigures[key] = to;
      if (from === undefined || from === to || reduceMotion.matches || !isFinite(to)) return;
      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / 500);
        var e = 1 - Math.pow(1 - t, 3);
        el.textContent = String(Math.round(from + (to - from) * e));
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  // The tab's frame with bars where the content will land.
  function skeleton() {
    var card = '<div class="cs-card"><span class="ms-skel" style="height:1.25rem;width:55%;"></span>' +
      '<span class="ms-skel" style="height:2.25rem;width:35%;margin-top:1.25rem;"></span></div>';
    return '<div class="cs-skel-head"><span class="ms-skel" style="height:2rem;width:14rem;"></span>' +
      '<span class="ms-skel" style="height:1rem;width:22rem;max-width:80%;"></span></div>' +
      '<div class="cs-skel-grid" aria-hidden="true">' + card + card + card + '</div>' +
      '<p class="ms-sr" role="status">Loading\u2026</p>';
  }

  // Paints a tab. Cards enter only when the tab changes, never on the
  // line's live refresh.
  var shownTab = null;
  function fill(html) {
    panel.innerHTML = html;
    if (shownTab !== S.tab) {
      panel.classList.remove('ms-enter');
      void panel.offsetWidth;
      panel.classList.add('ms-enter');
      shownTab = S.tab;
    } else {
      panel.classList.remove('ms-enter');
    }
    tick(panel);
    wirePanel();
  }

  function head(title, lede, right) {
    return '<div class="cs-head"><div><h1 class="cs-title">' + title + '</h1>' +
      (lede ? '<p class="cs-lede">' + lede + '</p>' : '') + '</div>' + (right || '') + '</div>';
  }

  function badge(kind, text) { return '<span class="ms-badge ms-badge--' + kind + '">' + esc(text) + '</span>'; }

  var STATUS = {
    booked: ['booked', 'Booked'], arrived: ['arrived', 'Arrived'], in_chair: ['chair', 'In the chair'],
    done: ['done', 'Finished'], cancelled: ['off', 'Cancelled'], no_show: ['off', 'No show']
  };

  /* ---------- Tabs ---------- */

  function renderTabs() {
    tabsEl.innerHTML = TABS
      .filter(function (t) { return !t.manager || ICON.auth.isManager(); })
      .map(function (t) {
        return '<button class="cs-tab" role="tab" data-tab="' + t.id + '"' +
          ' aria-selected="' + (S.tab === t.id ? 'true' : 'false') + '">' + icon(t.id) + t.label + '</button>';
      }).join('');

    tabsEl.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.tab = b.dataset.tab;
        say('');
        renderTabs();
        panel.innerHTML = skeleton();
        route();
      });
    });
  }

  function route() {
    if (S.tab === 'line')     return showLine();
    if (S.tab === 'calendar') return showCalendar();
    if (S.tab === 'services') return showServices();
    if (S.tab === 'team')     return showTeam();
    if (S.tab === 'hours')    return showHours();
    if (S.tab === 'qr')       return showQR();
    if (S.tab === 'shop')     return showShop();
  }

  /* ============================================================
     The line
     ============================================================ */

  async function showLine() {
    var out = await call(ICON.admin.queue());
    if (!out) return;
    S.queue = out.data || [];

    var waiting = S.queue.filter(function (r) { return r.status === 'waiting'; });
    var chair = S.queue.filter(function (r) { return r.status === 'in_chair'; });
    var chairs = Math.max(1, (S.shop && S.shop.active_chairs) || 1);

    var seats = '';
    for (var c = 0; c < chairs; c++) {
      seats += CHAIR.replace('<svg ', '<svg class="' + (c < chair.length ? 'is-busy' : '') + '" ');
    }

    var html = head('Today’s line',
        S.queue.length === 0 ? 'Nobody in the shop.'
          : 'Call the next person when a chair frees up. The line updates on its own.',
        ICON.auth.isManager() && S.queue.length
          ? '<button class="ms-btn ms-btn--danger" data-act="purge">Clear the line</button>' : '') +

      '<dl class="cs-stats">' +
        '<div class="cs-stat"><dt>' + icon('line') + 'Waiting</dt>' +
          '<dd><span class="v" data-tick="waiting">' + waiting.length + '</span></dd></div>' +
        '<div class="cs-stat cs-stat--forest"><dt>In the chair</dt>' +
          '<dd><span class="v" data-tick="chair">' + chair.length + '</span><span class="u">of ' + chairs + '</span></dd>' +
          '<dd class="cs-chairs" aria-hidden="true">' + seats + '</dd></div>' +
        '<div class="cs-stat"><dt>' + icon('clock') + 'Wait for a new walk-in</dt>' +
          '<dd><span class="v" data-tick="wait">' + ICON.queue.estimate(waiting.length) + '</span><span class="u">min</span></dd></div>' +
      '</dl>';

    html += '<div class="cs-split"><section aria-label="The line">';

    if (S.queue.length === 0) {
      html += '<div class="cs-empty">' + icon('empty') + '<strong>The line is empty</strong>' +
              'Add a walk-in, or wait for someone to scan the QR code.</div>';
    } else {
      var seen = 0;
      html += '<div class="cs-list ms-enter">' + S.queue.map(function (r, i) {
        var active = r.status === 'in_chair';
        if (!active) seen += 1;
        var meta = [];
        meta.push(icon('clock') + (active
          ? 'In the chair since ' + esc(ICON.fmtTime(r.called_at))
          : 'About ' + esc(ICON.fmtTime(ICON.queue.etaFor(seen)))));
        if (r.service_name) meta.push(icon('scissors') + esc(r.service_name));
        meta.push(icon('phone') + (r.phone_number ? esc(ICON.fmtPhone(r.phone_number)) : 'No number'));
        meta.push('Joined ' + esc(ICON.fmtRelative(r.join_time)));
        if (r.preferred_time) meta.push('Said ' + esc(ICON.fmtTime(r.preferred_time)));

        return '<article class="cs-ticket' + (active ? ' is-chair' : '') + '" style="--i:' + i + '">' +
          '<div class="cs-ticket__no num" aria-label="Ticket ' + ICON.padTicket(r.ticket_no) + '">' + ICON.padTicket(r.ticket_no) + '</div>' +
          '<div><div class="cs-ticket__who"><span class="cs-ticket__name">' + esc(r.customer_name) + '</span>' +
            (active ? badge('chair', 'In the chair') : badge('waiting', seen + ordinal(seen) + ' in line')) + '</div>' +
          '<div class="cs-meta">' + meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>' +
          (r.clip_notes ? '<span class="cs-note">' + esc(r.clip_notes) + '</span>' : '') +
          '</div><div class="cs-actions">' +
            (active
              ? '<button class="ms-btn ms-btn--forest" data-act="q" data-id="' + Number(r.id) + '" data-s="done">Finished</button>'
              : '<button class="ms-btn ms-btn--primary" data-act="q" data-id="' + Number(r.id) + '" data-s="in_chair">Call to chair</button>') +
            '<button class="ms-btn ms-btn--ghost" data-act="q" data-id="' + Number(r.id) + '" data-s="cancelled">Remove</button>' +
          '</div></article>';
      }).join('') + '</div>';
    }

    html += '</section><aside class="cs-sticky">' + deskForm() + '</aside></div>';

    fill(html);
  }

  function deskForm() {
    var svcs = (S.services.length ? S.services : (S.shop && S.shop.services) || [])
      .filter(function (s) { return s.is_active !== false; });

    return '<form class="cs-card" id="deskForm" novalidate>' +
      '<div class="cs-card__head"><h2 class="cs-card__title">' + icon('plus') + 'Walk-in desk</h2></div>' +
      '<p class="msg msg--bad" id="deskMsg" role="alert" hidden></p>' +
      '<div class="field"><label for="dName">Name</label>' +
        '<input type="text" id="dName" required maxlength="80" autocomplete="off" placeholder="Walk-in"></div>' +
      '<div class="field"><label for="dPhone">Mobile' +
        '<span class="help">' + (S.shop && S.shop.phone_required ? 'Required at this shop.' : 'Optional.') +
        '</span></label>' +
        '<input type="tel" id="dPhone"' + (S.shop && S.shop.phone_required ? ' required' : '') +
        ' autocomplete="off" placeholder="98450 00000"></div>' +
      (svcs.length
        ? '<div class="field"><label for="dService">Service</label><select id="dService">' +
          '<option value="">Not sure yet</option>' +
          svcs.map(function (s) {
            return '<option value="' + s.id + '">' + esc(s.name) + ' · ' +
                   s.duration_minutes + 'm' + (s.price_minor ? ' · ' + esc(money(s.price_minor)) : '') +
                   '</option>';
          }).join('') + '</select></div>'
        : '') +
      '<div class="field"><label for="dNotes">Notes<span class="help">Optional.</span></label>' +
        '<textarea id="dNotes" maxlength="500" placeholder="#4 guard fade"></textarea></div>' +
      '<button type="submit" class="ms-btn ms-btn--primary ms-btn--lg ms-btn--block" id="dBtn">Add to the line</button>' +
    '</form>';
  }

  /* ============================================================
     Calendar
     ============================================================ */

  async function showCalendar() {
    if (!S.calMonth) S.calMonth = firstOfMonth(new Date());

    var from = ICON.dateKey(S.calMonth);
    var counts = await call(ICON.admin.appointmentCounts(from, 42));
    if (!counts) return;
    S.counts = {};
    (counts.data || []).forEach(function (c) {
      S.counts[String(c.on_date).slice(0, 10)] = c;
    });

    var day = await call(ICON.admin.appointments(S.apptDay, S.apptDay));
    if (!day) return;
    S.appts = day.data || [];

    // Re-rendering (a new service or barber reloads the free times) must
    // not throw away what the desk already typed into the booking form.
    var draft = {};
    ['bName', 'bPhone', 'bNotes'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) draft[id] = el.value;
    });

    fill(
      head('Calendar', 'Pick a day to see its bookings, or take one over the phone.') +
      '<div class="cs-split--even"><section>' +
        '<div class="cs-card">' + monthGrid() + '</div>' + newBooking() +
      '</section><aside class="apptwrap">' + dayList() + '</aside></div>');

    Object.keys(draft).forEach(function (id) {
      var el = document.getElementById(id);
      if (el && draft[id]) el.value = draft[id];
    });
  }

  function firstOfMonth(d) { var x = new Date(d); x.setDate(1); x.setHours(0, 0, 0, 0); return x; }

  function monthGrid() {
    var first = S.calMonth;
    var year = first.getFullYear(), month = first.getMonth();
    var start = new Date(year, month, 1);
    var pad = start.getDay();
    var daysIn = new Date(year, month + 1, 0).getDate();
    var todayKey = ICON.dateKey(new Date());

    var cells = '';
    for (var i = 0; i < pad; i++) cells += '<button class="cal__cell" disabled aria-hidden="true" tabindex="-1"></button>';

    for (var d = 1; d <= daysIn; d++) {
      var dt = new Date(year, month, d);
      var key = ICON.dateKey(dt);
      var c = S.counts[key];
      var booked = c ? Number(c.booked) : 0;
      cells += '<button class="cal__cell' + (key === todayKey ? ' is-today' : '') + '"' +
        ' data-act="pickDay" data-date="' + key + '"' +
        (S.apptDay === key ? ' aria-pressed="true"' : '') +
        ' aria-label="' + key + (booked ? ', ' + booked + ' booked' : '') + '">' +
        '<span class="cal__num">' + d + '</span>' +
        (booked ? '<span class="cal__count">' + booked + '</span>' : '') +
        '</button>';
    }

    var MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

    return '<div class="cal">' +
      '<div class="cal__head">' +
        '<button class="ms-btn ms-btn--secondary" data-act="month" data-d="-1" aria-label="Previous month">←</button>' +
        '<span class="cal__month">' + MONTHS[month] + ' ' + year + '</span>' +
        '<button class="ms-btn ms-btn--secondary" data-act="month" data-d="1" aria-label="Next month">→</button>' +
      '</div>' +
      '<div class="cal__grid">' +
        ['S','M','T','W','T','F','S'].map(function (d) {
          return '<div class="cal__dow">' + d + '</div>';
        }).join('') + cells +
      '</div>' +
      '<p class="cal__note">The gold number on a day is how many bookings it holds.</p>' +
    '</div>';
  }

  // Taking a booking over the phone. The slot list comes from the same
  // available_slots() the customer sees, so the desk cannot double-book.
  function newBooking() {
    var svcs = S.services.filter(function (x) { return x.is_active !== false; });
    var team = S.team.filter(function (t) { return t.is_active !== false; });
    var dayLabel = ICON.fmtDate(S.apptDay + 'T00:00:00');

    if (!S.bookOpen) {
      return '<button class="ms-btn ms-btn--forest ms-btn--lg ms-btn--block" data-act="openBook" style="margin-top:1rem;">' +
             icon('plus') + 'Take a booking for ' + esc(dayLabel) + '</button>';
    }

    return '<form class="cs-card" id="bookForm" style="margin-top:1rem;" novalidate>' +
      '<div class="cs-card__head">' +
        '<h2 class="cs-card__title">' + icon('calendar') + 'New booking, ' + esc(dayLabel) + '</h2>' +
        '<button type="button" class="ms-btn ms-btn--ghost ms-btn--sm" data-act="closeBook">Cancel</button>' +
      '</div>' +
      '<p class="msg msg--bad" id="bookMsg" role="alert" hidden></p>' +

      '<div class="cs-form-grid cs-form-grid--two">' +
        '<div class="field"><label for="bName">Name</label>' +
          '<input type="text" id="bName" required maxlength="80" autocomplete="off" placeholder="Customer name"></div>' +
        '<div class="field"><label for="bPhone">Mobile' +
          '<span class="help">' + (S.shop && S.shop.phone_required ? 'Required at this shop.' : 'Optional.') +
          '</span></label><input type="tel" id="bPhone" autocomplete="off" placeholder="98450 00000"></div>' +
      '</div>' +

      '<div class="cs-form-grid cs-form-grid--two">' +
        '<div class="field"><label for="bService">Service</label><select id="bService" required>' +
          '<option value="">Pick a service…</option>' +
          svcs.map(function (x) {
            return '<option value="' + x.id + '"' + (String(S.bookService) === String(x.id) ? ' selected' : '') + '>' +
              esc(x.name) + ' · ' + x.duration_minutes + 'm' +

  function dayList() {
    var live = S.appts.filter(function (a) { return a.status !== 'cancelled' && a.status !== 'no_show'; }).length;
    var top = '<div class="cs-card__head">' +
      '<h2 class="cs-card__title">' + icon('calendar') + esc(ICON.fmtDate(S.apptDay + 'T00:00:00')) +
        (S.appts.length ? ' <span class="ms-badge ms-badge--plain">' + live + ' booked</span>' : '') + '</h2>' +
      '<button class="ms-btn ms-btn--secondary ms-btn--sm" data-act="today">Today</button></div>';

    if (S.appts.length === 0) {
      return top + '<div class="cs-empty">' + icon('calendar') + '<strong>No bookings</strong>' +
             'Nothing booked for this day yet.</div>';
    }

    var now = Date.now();
    return top + '<div class="cs-list ms-enter">' + S.appts.map(function (a, i) {
      var cancelled = a.status === 'cancelled' || a.status === 'no_show';
      var isNow = new Date(a.starts_at) <= now && new Date(a.ends_at) > now && !cancelled;
      var st = STATUS[a.status] || ['done', a.status];
      var meta = [];
      if (a.service_name) meta.push(icon('scissors') + esc(a.service_name));
      if (a.staff_name) meta.push(icon('user') + 'With ' + esc(a.staff_name));
      if (a.phone_number) meta.push(icon('phone') + esc(ICON.fmtPhone(a.phone_number)));
      if (a.price_minor) meta.push(esc(money(a.price_minor)));

      return '<article class="cs-appt' + (cancelled ? ' is-cancelled' : '') + (isNow ? ' is-now' : '') + '" style="--i:' + i + '">' +
        '<div class="cs-appt__time num">' + esc(ICON.fmtTime(a.starts_at)) +

        (a.notes ? '<span class="cs-note">' + esc(a.notes) + '</span>' : '') +

          '<div class="cs-form-actions" style="margin-top:1rem;">' +
            '<button class="ms-btn ms-btn--primary" data-act="printQR">Print</button>' +
            '<button class="ms-btn ms-btn--secondary" data-act="downloadQR">Download SVG</button>' +
          '</div>' +
          '<p class="cs-lede" style="margin-top:1.25rem;">' +
            'The code is drawn on this device. Nothing is sent to a QR service, so your ' +
            'link never leaves the shop.</p>' +
        '</div>' +
      '</div>');

    drawQR(url);
  }

  function drawQR(url) {
    var box = document.getElementById('qrBox');
    if (!box) return;
    if (typeof window.qrcode !== 'function') {
      box.innerHTML = '<p class="msg msg--bad" style="margin:0;">' +
        'The QR library did not load. Check that vendor/qrcode.js was deployed.</p>';
      return;
    }
    try {
      // Type 0 = auto-size, 'M' = medium error correction: still scans
      // with a bit of print smudging.
      var q = window.qrcode(0, 'M');
      q.addData(url);
      q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      var svg = box.querySelector('svg');
      if (svg) {
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', 'QR code for ' + url);
      }
    } catch (err) {
      console.error('[ICON] QR failed:', err);
      box.innerHTML = '<p class="msg msg--bad" style="margin:0;">Could not draw the QR code.</p>';
    }
  }

    panel.querySelectorAll('[data-act]').forEach(function (el) {

    var f;
    if ((f = document.getElementById('deskForm')))  f.addEventListener('submit', addWalkIn);
    if ((f = document.getElementById('svcForm')))   f.addEventListener('submit', saveService);
    if ((f = document.getElementById('staffForm'))) f.addEventListener('submit', saveStaff);
    if ((f = document.getElementById('closeForm'))) f.addEventListener('submit', addClosure);
    if ((f = document.getElementById('shopForm')))  f.addEventListener('submit', saveShop);
    if ((f = document.getElementById('bookForm'))) {
      f.addEventListener('submit', takeBooking);
      var sel = document.getElementById('bService');
      if (sel) sel.addEventListener('change', function () {
        S.bookService = sel.value || null;
        S.bookSlot = null;
        loadBookSlots();
      });
      var who = document.getElementById('bStaff');
      if (who) who.addEventListener('change', function () {
        S.bookStaff = who.value || null;
        S.bookSlot = null;
        loadBookSlots();
      });
    }
    if ((f = document.getElementById('pwForm')))    f.addEventListener('submit', changePw);

    panel.querySelectorAll('.hourrow input[data-role="open"]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        cb.closest('.hourrow').classList.toggle('is-closed', !cb.checked);
      });
    });
  }

  async function onAction(e) {
    var el = e.currentTarget;
    var act = el.dataset.act;

    /* queue */
    if (act === 'q') {
      el.disabled = true;
      if (el.dataset.s === 'cancelled' && !(await MS.confirm({ title: 'Remove from the line?', text: 'They will lose their place in the queue.', ok: 'Remove', cancel: 'Keep them', danger: true }))) {
        el.disabled = false; return;
      }
      await call(ICON.admin.setStatus(Number(el.dataset.id), el.dataset.s));
      return showLine();
    }

    if (act === 'purge') {
      if (!(await MS.confirm({ title: 'Close out everyone?', text: 'Everyone in the shop right now is closed out. This cannot be undone.', ok: 'Close out all', cancel: 'Not now', danger: true }))) return;
      var p = await call(ICON.admin.purge());
      if (p) say('Cleared ' + p.data + (p.data === 1 ? ' ticket.' : ' tickets.'), true);
      return showLine();
    }

    /* appointments */
    if (act === 'a') {
      el.disabled = true;
      if (el.dataset.s === 'cancelled' && !(await MS.confirm({ title: 'Cancel this booking?', text: 'The time is released and the customer\u2019s pass stops working.', ok: 'Cancel booking', cancel: 'Keep it', danger: true }))) {
        el.disabled = false; return;
      }
      await call(ICON.admin.setAppointmentStatus(Number(el.dataset.id), el.dataset.s));
      return showCalendar();
    }

    if (act === 'pickDay') {
      S.apptDay = el.dataset.date;
      // A different day means the chosen time no longer applies.
      S.bookSlot = null;
      if (S.bookOpen && S.bookService) { await showCalendar(); return loadBookSlots(); }
      return showCalendar();
    }

    if (act === 'openBook') {
      S.bookOpen = true; S.bookSlot = null; S.bookSlots = null;
      return showCalendar();
    }
    if (act === 'closeBook') {
      S.bookOpen = false; S.bookSlot = null; S.bookService = null; S.bookStaff = null;
      return showCalendar();
    }
    if (act === 'bookSlot') {
      S.bookSlot = el.dataset.at;
      return showCalendar();
    }
    if (act === 'today') {
      S.apptDay = ICON.dateKey(new Date());
      S.calMonth = firstOfMonth(new Date());
      return showCalendar();
    }
    if (act === 'month') {
      var m = new Date(S.calMonth);
      m.setMonth(m.getMonth() + Number(el.dataset.d));
      S.calMonth = firstOfMonth(m);
      return showCalendar();
    }

    /* services */
    if (act === 'editSvc') {
      S.editService = S.services.filter(function (s) { return String(s.id) === el.dataset.id; })[0];
      return showServices();
    }
    if (act === 'offSvc') {
      await call(ICON.admin.serviceRetire(Number(el.dataset.id)));
      return showServices();
    }
    if (act === 'onSvc') {
      var sv = S.services.filter(function (s) { return String(s.id) === el.dataset.id; })[0];
      if (sv) await call(ICON.admin.serviceSave({
        id: sv.id, name: sv.name, audience: sv.audience, category: sv.category,
        duration: sv.duration_minutes, priceMinor: sv.price_minor, isActive: true, sort: sv.sort_order
      }));
      return showServices();
    }

    /* team */
    if (act === 'editStaff') {
      S.editStaff = S.team.filter(function (t) { return String(t.id) === el.dataset.id; })[0];
      return showTeam();
    }
    if (act === 'offStaff') {
      await call(ICON.admin.staffRetire(Number(el.dataset.id)));
      return showTeam();
    }
    if (act === 'onStaff') {
      var st = S.team.filter(function (t) { return String(t.id) === el.dataset.id; })[0];
      if (st) await call(ICON.admin.staffSave({
        id: st.id, name: st.name, title: st.title, isActive: true, sort: st.sort_order
      }));
      return showTeam();
    }

    if (act === 'cancelEdit') {
      S.editService = null; S.editStaff = null;
      return route();
    }

    /* hours */
    if (act === 'saveHour') {
      var row = el.closest('.hourrow');
      var wd = Number(el.dataset.wd);
      var isOpen = row.querySelector('[data-role="open"]').checked;
      var from = row.querySelector('[data-role="from"]').value.trim();
      var to = row.querySelector('[data-role="to"]').value.trim();
      var ok = await call(ICON.admin.hoursSave(wd, isOpen, from || '09:00', to || '19:00'));
      if (ok) say(ICON.fmtDay(wd, true) + ' saved.', true);
      return showHours();
    }

    if (act === 'reopen') {
      await call(ICON.admin.closureSet(el.dataset.date, null, false));
      return showHours();
    }

    /* QR */
    if (act === 'copyUrl') {
      var input = document.getElementById('qrUrl');
      input.select();
      try {
        await navigator.clipboard.writeText(input.value);
        say('Link copied.', true);
      } catch (err) {
        document.execCommand && document.execCommand('copy');
        say('Link selected — press Ctrl/Cmd+C to copy.', true);
      }
      return;
    }
    if (act === 'printQR') return window.print();
    if (act === 'downloadQR') {
      var svg = document.querySelector('#qrBox svg');
      if (!svg) return;
      var blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (S.staff.salon_slug || 'shop') + '-qr.svg';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
  }

  /* ---------- Form handlers ---------- */

  async function addWalkIn(e) {
    e.preventDefault();
    var msg = document.getElementById('deskMsg');
    var btn = document.getElementById('dBtn');
    function bad(t) { msg.textContent = t; msg.hidden = false; }
    msg.hidden = true;

    var name = document.getElementById('dName').value.trim();
    var phone = document.getElementById('dPhone').value.trim();
    var svc = document.getElementById('dService');
    var notes = document.getElementById('dNotes').value.trim();

    if (name.length < 2) return bad('Enter a name.');
    if (S.shop && S.shop.phone_required && !phone) return bad('This shop needs a mobile number.');
    if (phone && !ICON.isValidPhone(phone)) return bad('That number needs 10 to 15 digits, or leave it blank.');

    btn.disabled = true; btn.textContent = 'Adding…';
    var out = await ICON.admin.register({
      name: name, phone: phone, notes: notes,
      serviceId: svc && svc.value ? Number(svc.value) : null
    });
    btn.disabled = false; btn.textContent = 'Add to the line';

    if (!out.ok) {
      if (out.expired) return bounce();
      return bad(out.error);
    }
    say('Ticket ' + ICON.padTicket(out.data.ticket_no) + ' added for ' + name + '.', true);
    showLine();
  }

  async function saveService(e) {
    e.preventDefault();
    var mins = parseInt(document.getElementById('sMins').value, 10);
    var priceMajor = parseFloat(document.getElementById('sPrice').value);
    if (!isFinite(mins) || mins < 5) return say('Minutes must be a number, 5 or more.');
    if (!isFinite(priceMajor) || priceMajor < 0) priceMajor = 0;

    var out = await call(ICON.admin.serviceSave({
      id: S.editService ? S.editService.id : null,
      name: document.getElementById('sName').value.trim(),
      audience: document.getElementById('sAud').value,
      category: document.getElementById('sCat').value,
      duration: mins,
      priceMinor: Math.round(priceMajor * 100),
      isActive: S.editService ? S.editService.is_active : true,
      sort: S.editService ? S.editService.sort_order : (S.services.length + 1)
    }));
    if (out) {
      say(S.editService ? 'Service saved.' : 'Service added.', true);
      S.editService = null;
    }
    showServices();
  }

  async function saveStaff(e) {
    e.preventDefault();
    var out = await call(ICON.admin.staffSave({
      id: S.editStaff ? S.editStaff.id : null,
      name: document.getElementById('tName').value.trim(),
      title: document.getElementById('tTitle').value.trim(),
      isActive: S.editStaff ? S.editStaff.is_active : true,
      sort: S.editStaff ? S.editStaff.sort_order : (S.team.length + 1)
    }));
    if (out) {
      say(S.editStaff ? 'Saved.' : 'Added to the team.', true);
      S.editStaff = null;
    }
    showTeam();
  }

  async function addClosure(e) {
    e.preventDefault();
    var d = document.getElementById('cDate').value;
    if (!d) return say('Pick a date.');
    var out = await call(ICON.admin.closureSet(d, document.getElementById('cWhy').value.trim(), true));
    if (out) say('Closed on ' + d + '.', true);
    showHours();
  }

  async function takeBooking(e) {
    e.preventDefault();
    var msg = document.getElementById('bookMsg');
    function bad(t) { msg.textContent = t; msg.hidden = false; }
    msg.hidden = true;

    var name = document.getElementById('bName').value.trim();
    var phone = document.getElementById('bPhone').value.trim();
    var notes = document.getElementById('bNotes').value.trim();

    if (name.length < 2) return bad('Enter a name.');
    if (S.shop && S.shop.phone_required && !phone) return bad('This shop needs a mobile number.');
    if (phone && !ICON.isValidPhone(phone)) return bad('That number needs 10 to 15 digits, or leave it blank.');
    if (!S.bookService) return bad('Pick a service.');
    if (!S.bookSlot) return bad('Pick a time.');

    var btn = document.getElementById('bBtn');
    btn.disabled = true; btn.textContent = 'Booking\u2026';

    var out = await ICON.admin.book({
      serviceId: Number(S.bookService),
      startsAt: S.bookSlot,
      name: name, phone: phone, notes: notes,
      staffId: S.bookStaff ? Number(S.bookStaff) : null
    });

    if (!out.ok) {
      btn.disabled = false;
      btn.textContent = 'Book ' + ICON.fmtTime(S.bookSlot);
      if (out.expired) return bounce();
      // Someone took it while the desk was typing.
      if (/just been taken/i.test(out.error)) {
        S.bookSlot = null;
        await loadBookSlots();
      }
      return bad(out.error);
    }

    say('Booked ' + name + ' for ' + ICON.fmtTime(S.bookSlot) + '.', true);
    S.bookOpen = false; S.bookSlot = null; S.bookService = null; S.bookStaff = null;
    showCalendar();
  }

  async function saveShop(e) {
    e.preventDefault();
    var num = function (id, dflt) {
      var v = parseInt(document.getElementById(id).value, 10);
      return isFinite(v) ? v : dflt;
    };
    var out = await call(ICON.admin.shopSave({
      name: document.getElementById('pName').value.trim(),
      address: document.getElementById('pAddr').value.trim(),
      contactPhone: document.getElementById('pPhone').value.trim(),
      kind: document.getElementById('pKind').value,
      category: document.getElementById('pCategory').value,
      isOpen: document.getElementById('pOpen').checked,
      phoneRequired: document.getElementById('pPhoneReq').checked,
      activeChairs: num('pChairs', 1),
      avgMinutes: num('pAvg', 15),
      slotMinutes: num('pSlot', 30),
      leadMinutes: num('pLead', 30),
      horizonDays: num('pHorizon', 14)
    }));
    if (out) {
      say('Shop settings saved.', true);
      document.getElementById('shopName').textContent =
        document.getElementById('pName').value.trim();
    }
    showShop();
  }

  async function changePw(e) {
    e.preventDefault();
    var out = await ICON.admin.changePassword(
      document.getElementById('pwOld').value,
      document.getElementById('pwNew').value
    );
    if (!out.ok) {
      if (out.expired) return bounce();
      return say(out.error);
    }
    alert('Password changed. Sign in again with the new one.');
    await ICON.auth.logout();
    location.replace('./login.html');
  }

  /* ---------- Sign out ---------- */

  document.getElementById('signOut').addEventListener('click', async function () {
    await ICON.auth.logout();
    location.replace('./login.html');
  });

  /* ============================================================
     Boot
     ============================================================ */

  (async function start() {
    S.staff = await ICON.auth.require('./login.html');
    if (!S.staff) return;

    document.body.dataset.gate = 'open';
    document.getElementById('who').innerHTML =
      '<span class="ms-mono" aria-hidden="true">' + esc(String(S.staff.display_name || '?').charAt(0)) + '</span>' +
      '<div><b>' + esc(S.staff.display_name) + '</b><span>' + esc(S.staff.role) + '</span></div>';

    var slug = S.staff.salon_slug || '';
    document.getElementById('viewLink').href = './index.html?shop=' + encodeURIComponent(slug);
    document.getElementById('boardLink').href = './tv.html?shop=' + encodeURIComponent(slug);

    var sh = await ICON.admin.shop();
    if (sh.ok) {
      S.shop = sh.data;
      document.getElementById('shopName').textContent = S.shop.name;
      document.title = S.shop.name + ' — Shop console';
    }

    // Pull services and team once: the walk-in desk and the booking form
    // both need them, and neither is in the admin_shop payload.
    var sv = await ICON.admin.services();
    if (sv.ok) S.services = sv.data || [];

    var tm = await ICON.admin.staff();
    if (tm.ok) S.team = tm.data || [];

    renderTabs();
    route();

    // The line is live; other tabs refresh when you open them.
    ICON.queue.subscribe('desk-queue', function () {
      if (S.tab === 'line') showLine();
    });
  })();
})();
</script>
