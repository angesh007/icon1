<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON — Now serving</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./icon.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="on-ink">

<div class="board">

  <header class="board__head">
    <div>
      <span class="wordmark">Icon</span>
      <div class="board__where">Perimeter Center &middot; Dunwoody</div>
    </div>
    <div class="board__wait">
      <div class="v num" id="wait">--</div>
      <div class="k">Minute wait for a walk-in</div>
    </div>
  </header>

  <div class="board__body">

    <section class="board__col">
      <h2 class="board__title"><span class="pip pip--live"></span> Now serving</h2>
      <ul class="board__list" id="serving"></ul>
    </section>

    <section class="board__col">
      <h2 class="board__title"><span class="pip" style="background: var(--chrome);"></span> Up next</h2>
      <ul class="board__list" id="upnext"></ul>
    </section>

  </div>
</div>

<script src="./config.js"></script>
<script src="./icon.js"></script>
<script>
(function () {
  'use strict';
  if (!window.ICON) return;
  var ICON = window.ICON;

  var servingEl = document.getElementById('serving');
  var upnextEl = document.getElementById('upnext');
  var waitEl = document.getElementById('wait');

  function empty(title, line) {
    return '<li><div class="empty"><strong>' + title + '</strong>' + line + '</div></li>';
  }

  async function render() {
    // Public screen: ticket number, first name and status only.
    var res = await ICON.openQueue('id,ticket_no,customer_name,status,join_time,called_at');

    if (res.error) {
      console.error('[ICON]', res.error);
      waitEl.textContent = '--';
      servingEl.innerHTML = empty('Reconnecting', 'The board will come back on its own.');
      upnextEl.innerHTML = '';
      return;
    }

    var rows = res.data || [];
    var inChair = rows.filter(function (r) { return r.status === 'in_chair'; });
    var waiting = rows.filter(function (r) { return r.status === 'waiting'; });

    waitEl.textContent = ICON.estimateWaitMinutes(waiting.length);

    servingEl.innerHTML = inChair.length === 0
      ? empty('Chair’s open', 'Walk in and take a ticket.')
      : inChair.map(function (row) {
          return '<li class="serving">' +
            '<span class="serving__no num">' + ICON.padTicket(row.ticket_no) + '</span>' +
            '<span><span class="serving__who">' + ICON.esc(firstName(row.customer_name)) + '</span>' +
            (row.called_at
              ? '<div class="serving__at">Started ' + ICON.esc(ICON.fmtTime(row.called_at)) + '</div>'
              : '') +
            '</span></li>';
        }).join('');

    upnextEl.innerHTML = waiting.length === 0
      ? empty('Nobody waiting', 'The line is clear.')
      : waiting.map(function (row, i) {
          return '<li class="upnext">' +
            '<span class="upnext__no num">' + ICON.padTicket(row.ticket_no) + '</span>' +
            '<span class="upnext__who">' + ICON.esc(firstName(row.customer_name)) + '</span>' +
            '<span class="upnext__eta num">' + ICON.esc(ICON.fmtTime(ICON.etaFor(i + 1))) + '</span>' +
            '</li>';
        }).join('');
  }

  // A lobby screen shows a first name and a last initial, not the full name.
  function firstName(full) {
    var parts = String(full || '').trim().split(/\s+/);
    if (parts.length === 1) return parts[0];
    return parts[0] + ' ' + parts[parts.length - 1].charAt(0).toUpperCase() + '.';
  }

  ICON.subscribeQueue('board', render);
})();
</script>
</body>
</html>
